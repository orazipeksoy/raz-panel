<style>
:root {
  --navy: #0A0714; --navy2: #241141; --ink: #ECEDF3; --mut: #A9ADC4;
  --line: #2E3040; --bg: #0A0B10; --card: #14151D;
  --green: #3DD6A0; --green-bg: #12291F; --red: #FB8585; --red-bg: #2A1518;
  --blue: #9E93F0; --amber: #F5B942; --amber-bg: #2E2410; --gold: #E3C05A;
}
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; }
header { background: linear-gradient(135deg, #0A0714 0%, #241141 55%, #3B2168 100%); padding: max(18px, env(safe-area-inset-top)) 20px 16px; border-bottom: 1px solid #2E2148; }
.hdr-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.logo { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,.12); display: flex; align-items: center; justify-content: center; font-weight: 900; color: #C9A227; font-size: 13px; letter-spacing: .02em; }
header h1 { color: #fff; font-size: 18px; font-weight: 800; }
header .sub { color: #A79ECF; font-size: 11px; display: block; margin-top: 1px; }
.hdr-right { margin-left: auto; text-align: right; }
.hdr-kasa-lbl { color: #A79ECF; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.hdr-kasa { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hdr-meta { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
#sync-badge { font-size: 11px; color: #A79ECF; }
.rst { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); color: #C9BEEA; font-size: 11px; padding: 4px 10px; border-radius: 6px; cursor: pointer; }
nav { background: var(--card); border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; padding: 0 8px; position: sticky; top: 0; z-index: 10; -webkit-overflow-scrolling: touch; box-shadow: 0 1px 4px rgba(14,42,71,.05); }
.tab { border: none; background: transparent; padding: 15px 15px; font-size: 14px; cursor: pointer; color: var(--mut); border-bottom: 3px solid transparent; font-weight: 700; white-space: nowrap; min-height: 46px; }
.tab.on { color: var(--gold); border-bottom-color: var(--gold); }
main { padding: 16px; max-width: 1150px; margin: 0 auto; padding-bottom: max(28px, env(safe-area-inset-bottom)); }
.card { background: linear-gradient(165deg, #1D1F2C 0%, var(--card) 55%); border-radius: 14px; padding: 16px; box-shadow: 0 3px 12px rgba(5,8,20,.28), 0 1px 2px rgba(0,0,0,.15); margin-bottom: 14px; border: 1px solid rgba(255,255,255,.03); }
.lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--mut); margin-bottom: 4px; font-weight: 700; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
@media (max-width: 700px) { .kpi-grid { grid-template-columns: 1fr 1fr; } }
.kpi { background: linear-gradient(165deg, #1E2130 0%, var(--card) 60%); border-radius: 14px; padding: 14px 16px; box-shadow: 0 3px 10px rgba(5,8,20,.25), 0 1px 2px rgba(0,0,0,.12); position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,.03); }
.kpi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, rgba(227,192,90,.35), transparent); }
.kpi .v { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 2px 0; }
.trend { font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; gap: 3px; padding: 2px 8px; border-radius: 20px; }
.trend.up { background: var(--green-bg); color: var(--green); }
.trend.down { background: var(--red-bg); color: var(--red); }
.trend.flat { background: #262837; color: var(--mut); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 9px; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); border-bottom: 2px solid var(--line); font-weight: 800; }
td { padding: 8px 9px; border-bottom: 1px solid #262837; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.num { text-align: right; }
.hareket-kart { background: #1B1D28; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; }
.hareket-kart-ust { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.hareket-kart-sol { flex: 1; min-width: 0; }
.hareket-kart-aciklama { font-weight: 800; font-size: 14px; cursor: pointer; word-break: break-word; line-height: 1.25; }
.hareket-kart-meta { font-size: 12.5px; color: var(--mut); margin-top: 2px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hareket-kart-meta .pill { font-size: 10.5px; padding: 2px 8px; }
.hareket-kart-sag { text-align: right; flex-shrink: 0; }
.hareket-kart-tutar { font-size: 15.5px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hareket-kart-alt { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; padding-top: 6px; border-top: 1px solid #262837; gap: 8px; }
.hareket-kart-not { font-size: 11.5px; color: var(--mut); margin-top: 2px; word-break: break-word; }
.hareketler-tablo-wrap { display: none; }
@media (min-width: 700px) {
  .hareketler-kartlar { display: none; }
  .hareketler-tablo-wrap { display: block; }
}
.yesil { color: var(--green); font-weight: 600; }
.kirmizi { color: var(--red); font-weight: 600; }
input, select { border: 1.5px solid #333648; border-radius: 10px; padding: 11px 12px; font-size: 16px; width: 100%; background: #1B1D28; color: var(--ink); -webkit-appearance: none; }
input:focus, select:focus { outline: 3px solid rgba(33,121,196,.15); border-color: var(--blue); }
.btn { background: var(--navy); color: #fff; border: none; border-radius: 11px; padding: 14px 22px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; letter-spacing: .01em; }
.btn:active { background: var(--navy2); }
.turbtn { flex: 1; padding: 13px; border-radius: 11px; border: 2px solid var(--line); font-weight: 800; font-size: 15px; cursor: pointer; background: #1B1D28; color: var(--mut); }
.turbtn.gelir-on { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.turbtn.gider-on { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.chart-wrap { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 8px; }
.chart-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 2px; height: 100%; }
.chart-bars { display: flex; gap: 2px; align-items: flex-end; height: 118px; width: 100%; justify-content: center; }
.cbar { width: 40%; max-width: 18px; border-radius: 3px 3px 0 0; min-height: 2px; }
.cbar.g { background: var(--green); opacity: .85; }
.cbar.r { background: var(--red); opacity: .75; }
.cbar.ciro { background: var(--amber); opacity: .9; }
.cbar.tonaj { background: var(--blue); opacity: .85; }
.chart-lbl { font-size: 9.5px; color: var(--mut); font-weight: 600; white-space: nowrap; }
.uyari { display: flex; align-items: center; gap: 10px; background: var(--amber-bg); border: 1px solid #4A3D1E; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
.uyari > span:nth-child(2) { flex: 1; }
.uyari.krit { background: var(--red-bg); border-color: #4A2328; }
.uyari-ikon { font-size: 16px; }
.chip { border: 1.5px solid var(--line); background: #1B1D28; color: var(--mut); font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; min-height: 40px; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chips { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 12px; padding-bottom: 2px; }
.bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 12px; }
.bar-row .name { width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.bar-track { flex: 1; height: 13px; background: #262837; border-radius: 7px; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--navy2), var(--blue)); border-radius: 7px; min-width: 2px; }
.bar-val { width: 105px; text-align: right; font-weight: 700; font-size: 12px; }
.toast { position: fixed; top: max(14px, env(safe-area-inset-top)); right: 14px; background: var(--green); color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 700; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.notrow { font-size: 11px; color: var(--mut); }
.formgrid { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stokbox { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; background: #1B1D28; padding: 12px; border-radius: 12px; border: 1px dashed #3A3D52; }
.adet-edit { border-bottom: 1.5px dashed #4A4E66; font-weight: 700; cursor: pointer; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mtitle { font-size: 15px; font-weight: 800; color: var(--gold); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.pill { font-size: 10px; background: rgba(201,162,39,.14); color: var(--amber); padding: 3px 9px; border-radius: 12px; font-weight: 800; }
.marj { font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
.mini { font-size: 11.5px; color: var(--mut); }
.hesap-satir { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #262837; font-size: 13.5px; }
.hesap-satir:last-child { border-bottom: none; }
.sil-x { background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 8px 12px; font-weight: 800; min-width: 40px; min-height: 40px; }
.sil-x:active { transform: scale(.9); }

/* Hafif görsel iyileştirmeler — ek JS/timer gerektirmez */
main { animation: fadeIn .18s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
.card { transition: box-shadow .15s ease; }
.card:hover { box-shadow: 0 2px 8px rgba(14,42,71,.11); }
.kpi { transition: transform .12s ease, box-shadow .15s ease; }
.kpi:hover { transform: translateY(-1px); box-shadow: 0 3px 10px rgba(14,42,71,.12); }
.tab { transition: color .12s ease, border-color .12s ease; }
.chip { transition: all .12s ease; }
.logo { box-shadow: inset 0 0 0 1px rgba(201,162,39,.35); }
header { position: relative; overflow: hidden; }
header::after { content:""; position:absolute; top:-40%; right:-8%; width:200px; height:200px; background: radial-gradient(circle, rgba(201,162,39,.14), transparent 70%); pointer-events:none; }
tr { transition: background-color .1s ease; }
.sil-x { transition: transform .1s ease, background .1s ease; border-radius: 6px; }
.sil-x:hover { background: var(--red-bg); transform: scale(1.1); }
::-webkit-scrollbar { height: 6px; width: 6px; }
::-webkit-scrollbar-thumb { background: #3A3D52; border-radius: 3px; }

#kilit-ekrani { position: fixed; inset: 0; background: linear-gradient(135deg, #0A0714 0%, #241141 60%, #3B2168 100%); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 20px; }
#kilit-ekrani img { height: 64px; }
.pin-noktalar { display: flex; gap: 14px; }
.pin-nokta { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: transparent; transition: all .15s ease; }
.pin-nokta.dolu { background: #C9A227; border-color: #C9A227; }
.pin-nokta.hata { background: #F87171; border-color: #F87171; animation: sallan .3s; }
@keyframes sallan { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.pin-tuslar { display: grid; grid-template-columns: repeat(3, 64px); gap: 12px; }
.pin-tus { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); color: #fff; font-size: 22px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pin-tus:active { background: rgba(201,162,39,.3); transform: scale(.95); }
.pin-tus.sil { font-size: 16px; color: #C9BEEA; }
#kilit-mesaj { color: #A79ECF; font-size: 13px; min-height: 18px; }
#app-icerik { display: none; }
</style>
</head>

window.addEventListener("error", function(e) {
  if (e && e.target && e.target.tagName === "SCRIPT") {
    window.__fbDurum = "Script yüklenemedi: " + (e.target.src || "?") + " (ağ engeli olabilir)";
  }

  if (e && e.message && !e.target) {
    window.__jsHata = e.message + (e.filename ? " ("+e.filename+":"+e.lineno+")" : "");
  }
}, true);

window.__bootOK = false;
setTimeout(function() {
  try {
    if (window.__bootOK) return;
    var kilit = document.getElementById("kilit-ekrani");
    var ic = document.getElementById("app-icerik");
    var kilitGorunur = kilit && kilit.style.display !== "none";
    var icerikGorunur = ic && ic.style.display && ic.style.display !== "none";
    // Kilit de içerik de görünmüyorsa → boot patlamış demektir
    if (!kilitGorunur && !icerikGorunur) {
      if (ic) ic.style.display = "block";
      var main = document.getElementById("main");

        var mesaj = window.__jsHata ? ("Teknik detay: " + window.__jsHata) : "Uygulama başlatılamadı.";

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { initializeFirestore, doc, getDoc, setDoc, onSnapshot, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDPgL-ogKfzX_a2kwlXRnQUbmBqIPtSqpY",
  authDomain: "raz-plastik.firebaseapp.com",
  projectId: "raz-plastik",
  storageBucket: "raz-plastik.firebasestorage.app",
  messagingSenderId: "643452674106",
  appId: "1:643452674106:web:6dd8f5d0eb1bb5083e1503",
  measurementId: "G-HN3V212J1S"
};
const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, {
  experimentalForceLongPolling: true,
  useFetchStreams: false
});
const DOC_REF = doc(db, "raz", "data");
window.__fbLoad = async function() {
  try {
    const s = await getDoc(DOC_REF);
    window.__fbDurum = "OK";
    return { ok: true, payload: s.exists() ? s.data().payload : null };
  }
  catch(e) {
    const kod = (e && e.code) ? e.code : "?";
    const msj = (e && e.message) ? e.message : String(e);
    window.__fbDurum = kod + " — " + msj;
    console.error("Firebase okuma hatası:", kod, msj, e);
    return { ok: false, error: kod + ": " + msj };
  }
};
window.__fbSave = async function(j) {
  try {
    window.__lastLocalWrite = j;
    await setDoc(DOC_REF, { payload: j, updatedAt: new Date().toISOString() });
    return true;
  }
  catch(e) { console.error(e); return false; }
};
// ============ OTOMATİK GÜNLÜK YEDEKLEME ============
window.__fbYedekAl = async function(gunKey, payload) {
  try {
    const yedekRef = doc(db, "raz_yedekler", gunKey);
    const mevcut = await getDoc(yedekRef);
    if (!mevcut.exists()) {
      await setDoc(yedekRef, { payload, savedAt: new Date().toISOString() });
    }
    return true;
  } catch(e) { console.error("Yedekleme hatası:", e); return false; }
};
window.__fbYedekleriListele = async function() {
  try {
    const q = query(collection(db, "raz_yedekler"), orderBy("savedAt", "desc"), limit(30));
    const snap = await getDocs(q);
    const liste = [];
    snap.forEach(d => liste.push({ id: d.id, savedAt: d.data().savedAt }));
    return liste;
  } catch(e) { console.error("Yedek listeleme hatası:", e); return []; }
};
window.__fbYedekGetir = async function(gunKey) {
  try {
    const yedekRef = doc(db, "raz_yedekler", gunKey);
    const snap = await getDoc(yedekRef);
    return snap.exists() ? snap.data().payload : null;
  } catch(e) { console.error("Yedek getirme hatası:", e); return null; }
};
window.__fbListen = function(callback) {
  try {
    onSnapshot(DOC_REF, (snap) => {
      if (snap.exists()) {
        const p = snap.data().payload;
        // Kendi yazdığımız veriyi tekrar işleme (döngüyü önle)
        if (p !== window.__lastLocalWrite) callback(p);
      }
    }, (err) => console.error("Dinleme hatası:", err));
  } catch(e) { console.error(e); }
};
// Tüm Firebase fonksiyonları tanımlandı — şimdi hazır sinyalini ver
window.__fbReady = true;
if (window.__onFbReady) { try { window.__onFbReady(); } catch(e) { console.error(e); } }
</script>

function fmt(v) { return (v == null || v === 0) ? "—" : "₺" + Number(v).toLocaleString("tr-TR", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtK(v) { if (v == null || v === 0) return "—"; const neg = v < 0 ? "−" : ""; const a = Math.abs(v); if (a >= 1000000) return neg + "₺" + (a/1000000).toLocaleString("tr-TR",{maximumFractionDigits:2}) + "M"; if (a >= 1000) return neg + "₺" + (a/1000).toLocaleString("tr-TR",{maximumFractionDigits:0}) + "K"; return fmt(v); }
// Gizli mod açıkken parasal metinleri (zaten fmt/fmtK ile biçimlendirilmiş) yıldızla maskeler.
// Sayı olmayan kısımları (₺ işareti, sonek gibi) korumaya çalışmadan sabit uzunlukta basit bir maske döner.
function pg(formatliMetin) { return gizliMod ? "₺••••••" : formatliMetin; }
function gizliModDegistir() {
  gizliMod = !gizliMod;
  try { localStorage.setItem("raz-gizli-mod", gizliMod ? "1" : "0"); } catch(e) {}
  render();
}
function fmtKg(v) { return v == null ? "—" : Number(v).toLocaleString("tr-TR", {maximumFractionDigits:2}); }

// Küçük bir trend çizgisi (sparkline) üretir — KPI kutularının içine gömülmek için.
function sparklineSvg(degerler, renk) {
  if (!degerler || degerler.length < 2) return "";
  const maxV = Math.max.apply(null, degerler.concat([1]));
  const minV = Math.min.apply(null, degerler.concat([0]));
  const araligi = (maxV - minV) || 1;
  const genislik = 58, yukseklik = 20, pad = 2;
  const noktalar = degerler.map((v, i) => {
    const x = pad + (i / (degerler.length - 1)) * (genislik - pad*2);
    const y = pad + (yukseklik - pad*2) - ((v - minV) / araligi) * (yukseklik - pad*2);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  const sonNokta = noktalar.split(" ").pop().split(",");
  return '<svg width="'+genislik+'" height="'+yukseklik+'" viewBox="0 0 '+genislik+' '+yukseklik+'" style="display:block;margin-top:5px;overflow:visible">'
    + '<polyline points="'+noktalar+'" fill="none" stroke="'+renk+'" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>'
    + '<circle cx="'+sonNokta[0]+'" cy="'+sonNokta[1]+'" r="2.2" fill="'+renk+'"/>'
    + '</svg>';
}

// Bir değeri bir referans üst sınıra göre dolgu çubuğu olarak gösterir (stok seviyesi gibi).
function doluCubuk(deger, ustSinir, renk) {
  const oran = Math.max(0, Math.min(1, (deger||0) / (ustSinir||1)));
  return '<div style="background:#14151F;border-radius:5px;height:5px;overflow:hidden;margin-top:5px;width:100%"><div style="width:'+(oran*100).toFixed(0)+'%;height:100%;background:'+renk+';border-radius:5px;transition:width .3s ease"></div></div>';
}
function fmtTarih(iso) { const p = iso.split("-"); return p[2]+"."+p[1]+"."+p[0]; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function jsStr(s) { return String(s == null ? "" : s).replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

function saglaId(d) {
  let ctr = 1;
  d.hareketler.forEach(h => { if (!h.__id) h.__id = "h" + (ctr++) + "_" + Math.random().toString(36).slice(2,7); });
  // Eski kayıtlarda (bu özellikler eklenmeden önce kaydedilmiş) eksik olabilecek alanlar
  if (!d.notlar) d.notlar = [];
  if (!d.krediler) {
    d.krediler = [
      {id:"k1",ad:"Deniz Bank Taşıt Kredisi (İveco)",taksitSayisi:24,taksitTutari:104741.29,anahtar:"iveco",ilkTarih:"2026-01-23"},
      {id:"k2",ad:"Lavera Kimya Kredisi",taksitSayisi:9,taksitTutari:200247.52,anahtar:"lavera",ilkTarih:"2026-06-22"},
      {id:"k3",ad:"Yeşileko Hammadde Kredisi",taksitSayisi:9,taksitTutari:234220.64,anahtar:"yeşileko",ilkTarih:"2026-06-29"}
    ];
  }
  if (!d.mamul) d.mamul = [];
  if (!d.hammadde) d.hammadde = [];
  d.hammadde.forEach(h => { if (!h.kalite) h.kalite = "Genel"; });
  if (!d.fiyatlar) d.fiyatlar = [];
  if (!d.gizliUyarilar) d.gizliUyarilar = [];
  if (!d.uretimler) d.uretimler = [];
  if (!d.sayimlar) d.sayimlar = [];
  if (!d.cariBakiyeler) d.cariBakiyeler = {}; // müşteri fazla ödemesi (kredi) — bir sonraki faturaya otomatik düşer
  if (!d.ayarlar) d.ayarlar = {};
  // İşçilik artık ürün tipine göre ayrı ayrı: 1.Kalite 25₺, 2.Kalite 15₺, ECO-1 20₺ (net plastik kg başına, masura hariç).
  // Eski tek-sayı formatındaysa (bu güncellemeden önce kaydedilmişse) yeni doğru değerlerle değiştirilir.
  if (!d.ayarlar.iscilik || typeof d.ayarlar.iscilik === "number") {
    d.ayarlar.iscilik = { "1. Kalite": 25, "2. Kalite": 15, "ECO-1": 20 };
  }
  ["1. Kalite","2. Kalite","ECO-1"].forEach(k => { if (d.ayarlar.iscilik[k] == null) d.ayarlar.iscilik[k] = ISCILIK_VARSAYILAN; });
  if (d.ayarlar.masuraFiyat == null) d.ayarlar.masuraFiyat = MASURA_FIYAT_VARSAYILAN;
  d.uretimler.forEach(u => { if (!u.__id) u.__id = "u" + (ctr++) + "_" + Math.random().toString(36).slice(2,7); });
  return d;
}

async function load() {
  try {
    const raw = localStorage.getItem("raz-data-v1");
    data = raw ? saglaId(JSON.parse(raw)) : saglaId(JSON.parse(JSON.stringify(SEED)));
  } catch(e) { data = saglaId(JSON.parse(JSON.stringify(SEED))); }
  resetForm(); resetUForm(); render();
  showSyncBadge("syncing");
  try {
    // 10 saniye zaman aşımı — takılırsa kullanıcı bilsin
    const zamanAsimi = new Promise((_, rej) => setTimeout(() => rej(new Error("zaman aşımı (10sn) — ağ/güvenlik duvarı engeli olabilir")), 10000));
    const sonuc = await Promise.race([window.__fbLoad(), zamanAsimi]);
    if (!sonuc.ok) {
      // Okuma HATASI — asla üstüne yazma, sadece uyar
      showSyncBadge("off");
      toast("Buluta erişilemedi: " + (sonuc.error || "bilinmeyen hata"));
      return;
    }
    if (sonuc.payload) {
      data = saglaId(JSON.parse(sonuc.payload));
      localStorage.setItem("raz-data-v1", JSON.stringify(data));
      resetForm(); resetUForm(); render(); showSyncBadge("ok");
    } else {
      // Bulut gerçekten boş — ilk kurulum, seed'i yaz
      await window.__fbSave(JSON.stringify(data));
      showSyncBadge("ok");
    }
    // Günlük otomatik yedek (o gün için henüz yoksa oluşturur)
    try {
      const bugunKey = yerelTarihStr();
      window.__fbYedekAl(bugunKey, JSON.stringify(data));
    } catch(e) {}
    // Canlı dinleme: başka cihaz kaydettiğinde otomatik güncelle
    window.__fbListen(function(cloudRaw2) {
      try {
        // 1) Kendi yazdığımız veriyi yok say (yankı)
        if (cloudRaw2 === window.__lastLocalWrite) return;
        // 2) Son kaydımızdan hemen sonra gelen bildirimi yok say (yarış koşulu koruması)
        if (window.__lastSaveTime && (Date.now() - window.__lastSaveTime) < 4000) return;
        const gelen = saglaId(JSON.parse(cloudRaw2));
        // 3) Gelen veri bizimkinden AZ kayıt içeriyorsa (bayat/eksik) üzerine yazma
        if (data && gelen.hareketler && data.hareketler && gelen.hareketler.length < data.hareketler.length && (Date.now() - (window.__lastSaveTime||0)) < 15000) return;
        data = gelen;
        localStorage.setItem("raz-data-v1", JSON.stringify(data));
        render();
        toast("↻ Diğer cihazdan güncellendi");
        showSyncBadge("ok");
      } catch(e) {}
    });
  } catch(e) {
    window.__fbDurum = (e && e.message) ? e.message : String(e);
    showSyncBadge("off");
  }
}

function showSyncBadge(state) {
  const el = document.getElementById("sync-badge");
  if (!el) return;
  if (state === "syncing") { el.textContent = "⟳ Senkronize ediliyor…"; el.style.color = "#A79ECF"; }
  else if (state === "ok") { el.textContent = "● Çevrimiçi — bulut senkron"; el.style.color = "#4ADE80"; }
  else { el.textContent = "● Çevrimdışı — " + (window.__fbDurum || "bağlantı bekleniyor"); el.style.color = "#F87171"; }
}

async function save() {
  const j = JSON.stringify(data);
  window.__lastLocalWrite = j; // yankı bastırma: kendi yazdığımız veriyi dinleyici tekrar işlemesin
  window.__lastSaveTime = Date.now();
  try { localStorage.setItem("raz-data-v1", j); } catch(e) {}
  toast("Kaydediliyor…");
  try {
    const ok = await window.__fbSave(j);
    toast(ok ? "✓ Kaydedildi" : "Yalnız yerel kaydedildi");
    showSyncBadge(ok ? "ok" : "off");
  } catch(e) { toast("Yalnız yerel kaydedildi"); showSyncBadge("off"); }
}

function hesapla() {
  const h = data.hareketler.slice().sort((a,b) => a.tarih.localeCompare(b.tarih));
  let bakiye = 0;
  const satirlar = h.map(x => { bakiye += (x.gelir||0) - (x.gider||0); return Object.assign({}, x, {bakiye}); });
  const toplamGelir = h.reduce((s,x) => s + (x.gelir||0), 0);
  const toplamGider = h.reduce((s,x) => s + (x.gider||0), 0);
  const aylik = {};
  h.forEach(x => {
    const k = x.tarih.slice(0,7);
    if (!aylik[k]) aylik[k] = {satis:0, diger:0, gider:0, kg:0, kgBilinen:true};
    if (x.gelir) {
      if (x.kategori === "Satış-Fatura" || x.kategori === "Perakende Satış") {
        aylik[k].satis += x.gelir;
        if (x.kg) aylik[k].kg += x.kg;
        else aylik[k].kgBilinen = false;
      }
      else aylik[k].diger += x.gelir;
    }
    if (x.gider) aylik[k].gider += x.gider;
  });
  const katGider = {};
  h.forEach(x => { if (x.gider) katGider[x.kategori] = (katGider[x.kategori]||0) + x.gider; });
  // Müşteri analizi (sadece satış gelirleri)
  const musteriler = {};
  h.forEach(x => {
    if (x.gelir && (x.kategori === "Satış-Fatura" || x.kategori === "Perakende Satış")) {
      const ad = normMusteri(x.aciklama);
      if (!musteriler[ad]) musteriler[ad] = {toplam: 0, sayi: 0, son: x.tarih};
      musteriler[ad].toplam += x.gelir;
      musteriler[ad].sayi += 1;
      if (x.tarih > musteriler[ad].son) musteriler[ad].son = x.tarih;
    }
  });
  return {satirlar, toplamGelir, toplamGider, bakiye, aylik, katGider, musteriler};
}

// UTC'ye çevirmeden CİHAZIN YEREL tarihini "YYYY-MM-DD" olarak döner.
// toISOString() her zaman UTC kullanır — Türkiye (UTC+3) gece 00:00-03:00 arası
// bir gün/ay geride gösterebilirdi. "Bugün" veya "bu ay" gerektiren HER yer bunu kullanmalı.
function yerelTarihStr(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const g = String(d.getDate()).padStart(2,"0");
  return y + "-" + m + "-" + g;
}
function buAyKey() { return yerelTarihStr().slice(0,7); }
function gecenAyKey() { const d = new Date(); const onceki = new Date(d.getFullYear(), d.getMonth()-1, 1); return yerelTarihStr(onceki).slice(0,7); }

function render() {
  const H = hesapla();
  document.getElementById("hdr-kasa").textContent = pg(fmt(H.bakiye));
  document.getElementById("hdr-kasa").style.color = H.bakiye >= 0 ? "#4ADE80" : "#F87171";
  const gizliIkon = document.getElementById("gizli-toggle");
  if (gizliIkon) gizliIkon.textContent = gizliMod ? "🙈" : "👁️";
  const anaTabs = [["ozet","Özet"],["yeni","+ Kayıt"],["tartim","Tartım"],["uretim","Üretim"],["hareketler","Hareketler"],["stok","Stok"]];
  const digerTabs = [["musteriler","Müşteriler"],["krediler","Krediler"],["notlar","Notlar"],["maliyet","Maliyet"],["aylik","Aylık"]];
  const digerAktif = digerTabs.some(t => t[0] === tab);
  document.getElementById("nav").innerHTML = anaTabs.map(t =>
    '<button class="tab' + (tab===t[0]?" on":"") + '" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>').join("")
    + '<button class="tab' + (digerAktif?" on":"") + '" onclick="digerAcik=!digerAcik;render()">Diğer '+(digerAktif?"▴":"▾")+'</button>';
  const eskiMenu = document.getElementById("diger-menu");
  if (eskiMenu) eskiMenu.remove();
  if (digerAcik) {
    document.getElementById("nav").insertAdjacentHTML("afterend",
      '<div id="diger-menu" style="display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)">'
      + digerTabs.map(t => '<button class="chip' + (tab===t[0]?" on":"") + '" onclick="digerAcik=false;setTab(\''+t[0]+'\')">'+t[1]+'</button>').join("")
      + '</div>');
  }
  const m = document.getElementById("main");
  if (tab === "ozet") m.innerHTML = rOzet(H);
  else if (tab === "yeni") m.innerHTML = rYeni();
  else if (tab === "tartim") m.innerHTML = rTartim();
  else if (tab === "uretim") m.innerHTML = rUretim();
  else if (tab === "hareketler") m.innerHTML = rHareketler(H);
  else if (tab === "stok") m.innerHTML = rStok();
  else if (tab === "musteriler") m.innerHTML = rMusteriler(H);
  else if (tab === "krediler") m.innerHTML = rKrediler();
  else if (tab === "notlar") m.innerHTML = rNotlar();
  else if (tab === "maliyet") m.innerHTML = rMaliyet();
  else if (tab === "aylik") m.innerHTML = rAylik(H);
}

function setTab(t) { tab = t; duzenleIdx = null; digerAcik = false; render(); }

function renderKorumali() {
  const el = document.activeElement;
  const id = el && el.id ? el.id : null;
  const selStart = (el && typeof el.selectionStart === "number") ? el.selectionStart : null;
  const selEnd = (el && typeof el.selectionEnd === "number") ? el.selectionEnd : null;
  render();
  if (id) {
    const yeni = document.getElementById(id);
    if (yeni) {
      yeni.focus();
      if (selStart !== null && yeni.setSelectionRange) {
        try { yeni.setSelectionRange(selStart, selEnd); } catch(e) {}
      }
    }
  }
}

function uyariGizle(key) {
  if (!data.gizliUyarilar) data.gizliUyarilar = [];
  if (!data.gizliUyarilar.includes(key)) data.gizliUyarilar.push(key);

}

// Sana sunulan rakamların doğruluğunu takip edebilmen için otomatik tutarsızlık taraması.
// Aciliyet uyarısı değil, "bunlara bir bak" listesi — bulunmazsa hiç görünmez.
function tutarsizlikKontrolleri() {
  const sorunlar = [];
  data.hammadde.forEach(h => {
    if ((h.kalan||0) < -0.01) sorunlar.push({ ikon: "⚠️", metin: '<b>'+esc(h.tedarikci+(h.aciklama!=="-"?" ("+h.aciklama+")":""))+'</b> stoğu eksiye düşmüş: '+fmtKg(h.kalan)+' kg' });
  });
  data.mamul.forEach(m => {
    if ((m.adet||0) < 0) sorunlar.push({ ikon: "⚠️", metin: '<b>'+esc(m.kalite+" "+m.tip+" "+m.genislik)+'</b> stoğu eksiye düşmüş: '+m.adet+' bobin' });
  });
  const buAy = buAyKey();
  const tumSatislarBuAy = data.hareketler.filter(h => h.tarih.slice(0,7)===buAy && h.gelir && (h.kategori==="Satış-Fatura"||h.kategori==="Perakende Satış"));
  const tanimsizSayisi = tumSatislarBuAy.filter(h => !h.kalemler || !h.kalemler.length).length;
  if (tanimsizSayisi > 0) sorunlar.push({ ikon: "ℹ️", metin: "Bu ay <b>"+tanimsizSayisi+"</b> satış stoktan ürün seçilmeden girilmiş — masura/ürün raporlarında bu satışlar görünmüyor" });
  return sorunlar;
}

function rOzet(H) {
  const ba = H.aylik[buAyKey()] || {satis:0, diger:0, gider:0};
  const ga = H.aylik[gecenAyKey()] || {satis:0, diger:0, gider:0};
  const baNet = ba.satis + ba.diger - ba.gider;
  const trendHtml = (simdiki, onceki) => {
    if (!onceki) return '<span class="trend flat">yeni</span>';
    const d = ((simdiki - onceki) / onceki * 100);
    if (Math.abs(d) < 1) return '<span class="trend flat">≈ aynı</span>';
    return d > 0 ? '<span class="trend up">▲ %'+Math.abs(d).toFixed(0)+'</span>' : '<span class="trend down">▼ %'+Math.abs(d).toFixed(0)+'</span>';
  };

  // Kritik stok uyarıları
  let uyarilar = "";
  const gizli = data.gizliUyarilar || [];
  const uyariKutu = (key, ikon, icerik, krit) => {
    if (gizli.includes(key)) return "";
    return '<div class="uyari'+(krit?" krit":"")+'"><span class="uyari-ikon">'+ikon+'</span><span>'+icerik+'</span>'
      + '<button onclick="uyariGizle(\''+key+'\')" style="background:none;border:none;color:inherit;opacity:.55;font-size:15px;cursor:pointer;padding:0 4px;font-weight:800;flex-shrink:0">×</button></div>';
  };
  data.mamul.forEach((m,i) => {
    const key = "stok_"+i;
    if (m.adet <= 0) uyarilar += uyariKutu(key, "⛔", '<b>'+esc(m.kalite+" "+m.tip+" "+m.genislik)+'</b> stoğu tükendi', true);
    else if (m.adet < STOK_ESIK) uyarilar += uyariKutu(key, "⚠️", '<b>'+esc(m.kalite+" "+m.tip+" "+m.genislik)+'</b> azalıyor — '+m.adet+' bobin kaldı', false);
  });
  data.hammadde.forEach((h,i) => {
    if (h.not) uyarilar += uyariKutu("ham_"+i, "📄", '<b>'+esc(h.tedarikci)+' '+esc(h.aciklama)+'</b> — '+esc(h.not), false);
  });

  // Aktif not hatırlatıcıları — × direkt notu tamamlandı yapar
  const aktifNotlar = data.notlar.filter(n => !n.tamamlandi);
  aktifNotlar.slice(0,3).forEach(n => {
    if (!gizli.includes("not_"+n.id)) {
      uyarilar += '<div class="uyari"><span class="uyari-ikon">📝</span><span>'+esc(n.metin)+'</span>'
        + '<button onclick="notToggle(\''+n.id+'\')" style="background:none;border:none;color:inherit;opacity:.55;font-size:15px;cursor:pointer;padding:0 4px;font-weight:800;flex-shrink:0" title="Tamamlandı işaretle">×</button></div>';
    }
  });

  // Ödeme vadesi uyarıları — bugüne 3 gün veya daha az kalan / geçmiş, ödenmemiş
  const bugunIso = yerelTarihStr();
  const uc3gunSonra = new Date(); uc3gunSonra.setDate(uc3gunSonra.getDate()+3);
  const uc3IsoSonra = yerelTarihStr(uc3gunSonra);
  data.hareketler.forEach(h => {
    if (h.tur === "GELİR" && h.vade) {
      const durum = tahsilatDurumu(h);
      if (durum.tamamlandiMi) return;
      const key = "vade_"+h.__id;
      const kalanEtiket = durum.toplamTahsil > 0.01 ? " (kalan: "+fmt(durum.kalan)+")" : " — "+fmt(durum.kalan);
      if (h.vade < bugunIso) {
        uyarilar += uyariKutu(key, "⏰", '<b>'+esc(h.aciklama)+'</b> ödemesi <b>'+fmtTarih(h.vade)+'</b> tarihinde gecikti'+kalanEtiket, true);
      } else if (h.vade <= uc3IsoSonra) {
        uyarilar += uyariKutu(key, "📅", '<b>'+esc(h.aciklama)+'</b> ödeme vadesi yaklaşıyor: <b>'+fmtTarih(h.vade)+'</b>'+kalanEtiket, false);
      }
    }
  });

  // Kredi taksit vadesi uyarıları — aynı 3 gün penceresi, ödeme vadesi uyarılarıyla aynı mantık
  data.krediler.forEach(k => {
    const c = krediHesapla(k);
    if (!c.sonrakiTarih) return; // tamamen ödenmiş
    const key = "kredi_"+k.id;
    if (c.sonrakiTarih < bugunIso) {
      uyarilar += uyariKutu(key, "⏰", '<b>'+esc(k.ad)+'</b> kredi taksiti <b>'+fmtTarih(c.sonrakiTarih)+'</b> tarihinde gecikti — '+fmt(k.taksitTutari), true);
    } else if (c.sonrakiTarih <= uc3IsoSonra) {
      uyarilar += uyariKutu(key, "📅", '<b>'+esc(k.ad)+'</b> kredi taksiti yaklaşıyor: <b>'+fmtTarih(c.sonrakiTarih)+'</b> — '+fmt(k.taksitTutari), false);
    }
  });

  // Kontrol listesi (tutarsızlık taraması) — sadece bulgu varsa görünür
  const kontroller = tutarsizlikKontrolleri();
  let kontrolHtml = "";
  if (kontroller.length) {
    kontrolHtml = '<div class="card" style="margin-bottom:14px"><div class="mtitle">🔍 Kontrol Listesi <span class="pill">'+kontroller.length+'</span></div>';
    kontroller.forEach(s => {
      kontrolHtml += '<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #262837;font-size:13px"><span>'+s.ikon+'</span><span>'+s.metin+'</span></div>';
    });
    kontrolHtml += '</div>';
  }

  // Son 7 ay grafik
  const keys = Object.keys(H.aylik).sort().slice(-7);
  const maxV = Math.max(...keys.map(k => Math.max(H.aylik[k].satis + H.aylik[k].diger, H.aylik[k].gider)), 1);
  let chart = keys.map(k => {
    const a = H.aylik[k];
    const g = (a.satis + a.diger) / maxV * 100;
    const r = a.gider / maxV * 100;
    const p = k.split("-");
    return '<div class="chart-col"><div class="chart-bars">'
      + '<div class="cbar g" style="height:'+g+'%"></div>'
      + '<div class="cbar r" style="height:'+r+'%"></div>'
      + '</div><span class="chart-lbl">'+AYLAR_KISA[parseInt(p[1])-1]+'</span></div>';
  }).join("");

  // Top 5 müşteri
  const top5 = Object.entries(H.musteriler).sort((a,b) => b[1].toplam - a[1].toplam).slice(0,5);
  const maxM = top5.length ? top5[0][1].toplam : 1;
  let topHtml = top5.map(mv =>
    '<div class="bar-row"><span class="name">'+esc(mv[0])+'</span>'
    + '<div class="bar-track"><div class="bar-fill" style="width:'+(mv[1].toplam/maxM*100)+'%"></div></div>'
    + '<span class="bar-val">'+fmtK(mv[1].toplam)+'</span></div>').join("");

  const mamulKg = data.mamul.reduce((s,m) => s + (m.adet||0)*(m.kgBobin||0), 0);
  const hamKg = data.hammadde.reduce((s,h) => s + (h.kalan||0), 0);

  // Ürün dağılımı pasta grafiği (urunTipi girilmiş kayıtlar üzerinden)
  const urunToplam = {};
  let urunBilinmeyen = 0, urunGenelToplam = 0;
  data.hareketler.forEach(h => {
    if (h.tur === "GELİR" && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış") && h.gelir) {
      urunGenelToplam += h.gelir;
      if (h.urunTipi) urunToplam[h.urunTipi] = (urunToplam[h.urunTipi]||0) + h.gelir;
      else urunBilinmeyen += h.gelir;
    }
  });
  const urunRenkler = {"1. Kalite":"#8B7FE8","2. Kalite":"#34D399","ECO-1":"#F5B942","Karışık":"#A78BFA"};
  let pastaHtml = "";
  if (Object.keys(urunToplam).length > 0) {
    let cumulatif = 0;
    const gradParcalar = [];
    const girdiler = Object.entries(urunToplam).sort((a,b) => b[1]-a[1]);
    girdiler.forEach(([u,v]) => {
      const pay = v / urunGenelToplam * 100;
      const renk = urunRenkler[u] || "#8D90A6";
      gradParcalar.push(renk+" "+cumulatif.toFixed(1)+"% "+(cumulatif+pay).toFixed(1)+"%");
      cumulatif += pay;
    });
    if (urunBilinmeyen > 0) {
      const pay = urunBilinmeyen / urunGenelToplam * 100;
      gradParcalar.push("#3A3D52 "+cumulatif.toFixed(1)+"% "+(cumulatif+pay).toFixed(1)+"%");
    }
    const legend = girdiler.map(([u,v]) =>
      '<div style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:10px;height:10px;border-radius:3px;background:'+(urunRenkler[u]||"#8D90A6")+'"></span>'+esc(u)+' <b>'+fmtK(v)+'</b> <span style="color:var(--mut)">(%'+(v/urunGenelToplam*100).toFixed(0)+')</span></div>'
    ).join("");
    const bilinmeyenLegend = urunBilinmeyen > 0
      ? '<div style="display:flex;align-items:center;gap:6px;font-size:12px"><span style="width:10px;height:10px;border-radius:3px;background:#3A3D52"></span>Ürün tipi girilmemiş <b>'+fmtK(urunBilinmeyen)+'</b></div>'
      : '';
    pastaHtml = '<div class="card"><div class="mtitle">Ürün Dağılımı <span class="pill">satış geliri</span></div>'
      + '<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">'
      + '<div style="width:110px;height:110px;border-radius:50%;background:conic-gradient('+gradParcalar.join(",")+');flex-shrink:0"></div>'
      + '<div style="display:flex;flex-direction:column;gap:6px">'+legend+bilinmeyenLegend+'</div>'
      + '</div></div>';
  }

  // Aylık Ciro & Tonaj grafiği (satış geliri vs satılan kg — iki ayrı eksen, yan yana barlar)
  const maxCiro = Math.max(...keys.map(k => H.aylik[k].satis), 1);
  const maxTonaj = Math.max(...keys.map(k => H.aylik[k].kg||0), 1);
  let ciroTonajChart = keys.map(k => {
    const a = H.aylik[k];
    const ch = maxCiro ? (a.satis / maxCiro * 100) : 0;
    const th = maxTonaj ? ((a.kg||0) / maxTonaj * 100) : 0;
    const p = k.split("-");
    return '<div class="chart-col"><div class="chart-bars">'
      + '<div class="cbar ciro" style="height:'+ch+'%" title="Ciro: '+fmtK(a.satis)+'"></div>'
      + '<div class="cbar tonaj" style="height:'+th+'%" title="Tonaj: '+fmtKg(a.kg||0)+' kg"></div>'
      + '</div><span class="chart-lbl">'+AYLAR_KISA[parseInt(p[1])-1]+'</span></div>';
  }).join("");

  const buAyKarOz = karlilikAyOzeti(buAyKey());

  return '<div class="kpi-grid">'
    + '<div class="kpi"><div class="lbl">Bu Ay Satış</div><div class="v yesil">'+pg(fmtK(ba.satis))+'</div>'+trendHtml(ba.satis, ga.satis)+'<span class="mini">'+(ba.kg>0?fmtKg(ba.kg)+' kg'+(ba.kgBilinen?'':'+'):'kg bilgisi yok')+'</span>'+sparklineSvg(keys.map(k => H.aylik[k].satis), "var(--green)")+'</div>'
    + '<div class="kpi"><div class="lbl">Bu Ay Gider</div><div class="v kirmizi">'+pg(fmtK(ba.gider))+'</div>'+trendHtml(ba.gider, ga.gider)+sparklineSvg(keys.map(k => H.aylik[k].gider), "var(--red)")+'</div>'
    + '<div class="kpi"><div class="lbl">Bu Ay Net</div><div class="v" style="color:'+(baNet>=0?"var(--green)":"var(--red)")+'">'+pg((baNet>=0?"+":"")+fmtK(baNet))+'</div><span class="mini">'+AYLAR[new Date().getMonth()]+'</span></div>'
    + '<div class="kpi"><div class="lbl">Stok</div><div class="v">'+fmtKg(mamulKg+hamKg)+' kg</div><span class="mini">'+fmtKg(mamulKg)+' mamul · '+fmtKg(hamKg)+' ham</span></div>'
    + '<div class="kpi"><div class="lbl">Bu Ay Tahmini Kâr</div><div class="v" style="color:'+(buAyKarOz.karMarji==null?"var(--mut)":(buAyKarOz.toplamKar>=0?"var(--green)":"var(--red)"))+'">'+(buAyKarOz.satisSayisi?pg(fmtK(buAyKarOz.toplamKar)):"—")+'</div><span class="mini">'+(buAyKarOz.karMarji!=null?"marj %"+buAyKarOz.karMarji.toFixed(1):"satış yok")+' · tahmini</span></div>'
    + '</div>'
    + (uyarilar ? '<div style="margin-bottom:14px">'+uyarilar+'</div>' : '')
    + (kontrolHtml)
    + pastaHtml
    + '<div class="card"><div class="mtitle">Aylık Gelir / Gider <span class="pill">son 7 ay</span></div>'
    + '<div class="chart-wrap">'+chart+'</div>'
    + '<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--mut)"><span><span style="display:inline-block;width:9px;height:9px;background:var(--green);border-radius:2px;margin-right:4px"></span>Gelir</span><span><span style="display:inline-block;width:9px;height:9px;background:var(--red);border-radius:2px;margin-right:4px"></span>Gider</span></div></div>'
    + '<div class="card"><div class="mtitle">Aylık Ciro & Tonaj <span class="pill">son 7 ay</span></div>'
    + '<div class="chart-wrap">'+ciroTonajChart+'</div>'
    + '<div style="display:flex;gap:14px;margin-top:10px;font-size:11px;color:var(--mut)"><span><span style="display:inline-block;width:9px;height:9px;background:var(--amber);border-radius:2px;margin-right:4px"></span>Ciro (₺)</span><span><span style="display:inline-block;width:9px;height:9px;background:var(--blue);border-radius:2px;margin-right:4px"></span>Tonaj (kg)</span></div>'
    + '<div class="mini" style="margin-top:6px">İki bar farklı ölçeklerde: ciro o ayki en yüksek ciroya, tonaj o ayki en yüksek tonaja göre orantılı — direkt boy karşılaştırması değil, ay ay trend takibi içindir.</div></div>'
    + '<div class="card"><div class="mtitle">En İyi Müşteriler <span class="pill">tüm zamanlar</span></div>'+topHtml+'</div>';
}

// ============ YENİ KAYIT ============
function rYeni() {
  const gelirMi = form.tur === "GELİR";
  const kats = gelirMi ? GELIR_KAT : GIDER_KAT;
  let html = '<div class="card"><div class="mtitle">Yeni Kayıt</div><div class="formgrid">';
  html += '<div style="display:flex;gap:10px"><button class="turbtn'+(gelirMi?" gelir-on":"")+'" onclick="setTur(\'GELİR\')">▲ GELİR</button><button class="turbtn'+(!gelirMi?" gider-on":"")+'" onclick="setTur(\'GİDER\')">▼ GİDER</button></div>';
  html += '<div class="row2">';
  html += '<div><div class="mini" style="margin-bottom:5px">Tarih</div><input type="date" id="f-tarih" value="'+form.tarih+'" onchange="fSet(\'tarih\',this.value)"></div>';
  html += '<div><div class="mini" style="margin-bottom:5px">Kategori</div><select id="f-kat" onchange="fSet(\'kategori\',this.value);render()">'+kats.map(k => '<option'+(form.kategori===k?" selected":"")+'>'+k+'</option>').join("")+'</select></div>';
  html += '</div>';
  html += '<div style="position:relative"><div class="mini" style="margin-bottom:5px">Açıklama (firma / kişi / iş)</div><input type="text" id="f-acik" placeholder="ör. Rekor Plastik" value="'+esc(form.aciklama)+'" oninput="aciklamaInputDegisti(this.value)" autocomplete="off"><div id="acik-oneri" style="position:absolute;left:0;right:0;top:100%;z-index:20"></div></div>';
  html += '<div id="musteri-fiyat-bilgi">'+musteriFiyatBilgiHtml(form.aciklama)+'</div>';
  html += '<div class="row2">';
  html += '<div><div class="mini" style="margin-bottom:5px">Tutar (₺) — KDV dahil</div><input type="text" id="f-tutar" inputmode="decimal" placeholder="ör. 24500 veya 24.500,50" value="'+esc(form.tutar)+'" oninput="fSet(\'tutar\',this.value)"></div>';
  html += '<div><div class="mini" style="margin-bottom:5px">Not (isteğe bağlı)</div><input type="text" id="f-not" placeholder="ör. fatura no, detay" value="'+esc(form.not)+'" oninput="fSet(\'not\',this.value)"></div>';
  html += '</div>';

  const stokSecim = gelirMi && (form.kategori === "Satış-Fatura" || form.kategori === "Perakende Satış");
  if (stokSecim) {
    html += '<div><div class="mini" style="margin-bottom:5px">Vade (ödeme bekleniyorsa)</div><input type="date" id="f-vade" value="'+(form.vade||"")+'" onchange="fSet(\'vade\',this.value)"></div>';
    html += '<div class="stokbox" style="grid-template-columns:1fr;gap:10px"><div class="mini" style="font-weight:800">Satılan Ürünler <span style="font-weight:400">— fatura kalemleri (stoktan otomatik düşer)</span></div>';
    let genelToplam = 0;
    (form.kalemler||[]).forEach((kal,ki) => {
      const m = data.mamul[parseInt(kal.stokIdx)];
      const adet = parseTL(kal.adet);
      const kgGirilen = parseTL(kal.kg);
      const standartKg = (m && !isNaN(adet) && adet > 0) ? adet * (m.kgBobin||0) : 0;
      const hesap = kalemKgTutar(kal);
      const satirKg = hesap.kg, satirTutar = hesap.tutar;
      genelToplam += satirTutar;
      const kgOzelMi = !isNaN(kgGirilen) && kgGirilen > 0; // kullanıcı gerçek tartılan kg'yi elle girdi mi
      const fiyatAdetMi = kal.fiyatTuru === "adet";
      const fiyat = parseTL(kal.fiyat);
      html += '<div style="background:#1B1D28;border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px">'
        + '<div style="display:flex;gap:8px;align-items:center">'
        + '<select style="flex:1" onchange="kalemStokSec('+ki+',this.value)"><option value="">— ürün seç —</option>'
        + data.mamul.map((mm,mi) => '<option value="'+mi+'"'+(String(kal.stokIdx)===String(mi)?" selected":"")+'>'+esc(mm.kalite+" · "+mm.tip+" · "+mm.genislik+(mm.gramaj!=="-"?" · "+mm.gramaj:""))+' (stok: '+mm.adet+')</option>').join("")
        + '<option value="__yeni">+ yeni ürün oluştur…</option>'
        + '</select>'
        + '<button class="sil-x" onclick="kalemSil('+ki+')">×</button>'
        + '</div>'
        + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        + '<div style="flex:1;min-width:70px"><div class="mini" style="margin-bottom:3px">Adet (bobin)</div><input type="text" inputmode="decimal" placeholder="ör. 3" value="'+esc(kal.adet)+'" onchange="kalemSet('+ki+',\'adet\',this.value);render()"></div>'
        + '<div style="flex:1;min-width:90px"><div class="mini" style="margin-bottom:3px">Net Kg'+(kgOzelMi?"":" (tahmini)")+'</div><input type="text" inputmode="decimal" placeholder="'+(standartKg>0?fmtKg(standartKg):"ör. 48")+'" value="'+esc(kal.kg)+'" onchange="kalemSet('+ki+',\'kg\',this.value);render()"></div>'
        + '</div>'
        + '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
        + '<div class="seg" style="display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0">'
        + '<button type="button" style="padding:12px 16px;font-size:13.5px;min-height:44px;border:none;cursor:pointer;background:'+(fiyatAdetMi?"var(--navy2)":"#22232F")+';color:'+(fiyatAdetMi?"#fff":"var(--mut)")+'" onclick="kalemFiyatTuruDegistir('+ki+',\'adet\')">Adet Fiyatı</button>'
        + '<button type="button" style="padding:12px 16px;font-size:13.5px;min-height:44px;border:none;cursor:pointer;background:'+(!fiyatAdetMi?"var(--navy2)":"#22232F")+';color:'+(!fiyatAdetMi?"#fff":"var(--mut)")+'" onclick="kalemFiyatTuruDegistir('+ki+',\'kg\')">Kg Fiyatı</button>'
        + '</div>'
        + '<input type="text" inputmode="decimal" style="flex:1;min-width:90px" placeholder="'+(fiyatAdetMi?"₺/adet KDV hariç":"₺/kg KDV hariç")+'" value="'+esc(kal.fiyat)+'" onchange="kalemSet('+ki+',\'fiyat\',this.value);render()">'
        + '</div>'
        + (standartKg > 0 && !kgOzelMi ? '<div class="mini">Net kg girilmedi — stok kg\'sına göre ('+fmtKg(standartKg)+' kg) hesaplanıyor. Tartıda farklı çıktıysa yukarıya gerçek kiloyu yaz.</div>' : '')
        + (satirTutar > 0 ? '<div class="mini">'+(fiyatAdetMi ? ((isNaN(adet)?0:adet)+' adet × '+String(fiyat).replace(".",",")+'₺/adet') : (fmtKg(satirKg)+' kg × '+String(fiyat).replace(".",",")+'₺/kg'))+' · KDV dahil tutar: <b style="color:var(--green)">'+fmt(satirTutar)+'</b> · stoktan düşecek: <b>'+(isNaN(adet)?0:adet)+' bobin</b> · toplam: <b>'+fmtKg(satirKg)+' kg</b></div>' : '')
        + '</div>';
    });
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="chip" onclick="kalemEkle()">+ Satır Ekle</button><button class="chip" style="color:var(--green);border-color:var(--green)" onclick="mamulEkle()">+ Stoğa Yeni Ürün</button></div>';
    if (genelToplam > 0) html += '<div class="mini" style="font-size:14px">Kalemler toplamı (KDV dahil): <b style="color:var(--green)">'+fmt(genelToplam)+'</b> <button class="chip" style="margin-left:6px;color:var(--green);border-color:var(--green)" onclick="tutarOneriKullan()">Tutara Yaz</button></div>';
    html += '</div>';
    const oKg = kalemToplamKg();
    html += '<div><div class="mini" style="margin-bottom:5px">Satış Kg <span style="color:var(--red)">*</span></div>'
      + '<input type="text" id="f-satis-kg" inputmode="decimal" placeholder="ör. 320" value="'+esc(form.satisKg)+'" oninput="fSet(\'satisKg\',this.value)">'
      + (oKg > 0 ? '<div class="mini" style="margin-top:5px">Kalemlerden hesaplanan: <b>'+fmtKg(oKg)+' kg</b> <button class="chip" style="margin-left:6px;color:var(--green);border-color:var(--green)" onclick="satisKgOneriKullan()">Kg\'ye Yaz</button></div>' : '<div class="mini" style="margin-top:5px">Kayıt için zorunlu — elle gir ya da yukarıdan kalem ekleyip önerilen değeri kullan.</div>')
      + '</div>';
  }

  const hamAlim = !gelirMi && form.kategori === "Hammadde";
  if (hamAlim) {
    html += '<div class="row2">';
    html += '<div><div class="mini" style="margin-bottom:5px">Hammadde Stoğu (kalan artar)</div><select id="f-ham" onchange="fSet(\'hamIdx\',this.value)"><option value="">— stok güncellenmesin —</option>'
      + data.hammadde.map((hm,hi) => '<option value="'+hi+'"'+(String(form.hamIdx)===String(hi)?" selected":"")+'>'+esc(hm.tedarikci+" ("+hm.aciklama+")")+'</option>').join("")
      + '</select></div>';
    html += '<div><div class="mini" style="margin-bottom:5px">Alınan Kg</div><input type="text" id="f-ham-kg" inputmode="decimal" placeholder="ör. 3021" value="'+esc(form.hamKg)+'" oninput="fSet(\'hamKg\',this.value)"></div>';
    html += '</div>';
  }

  html += '<button class="btn" style="background:'+(gelirMi?"var(--green)":"var(--red)")+'" onclick="kaydet()">Kaydet</button>';
  html += '</div></div>';
  return html;
}

function isimListesi() {
  const s = new Set();
  data.hareketler.forEach(h => { if (h.aciklama) s.add(h.aciklama); });
  return Array.from(s);
}

function aciklamaInputDegisti(v) {
  form.aciklama = v;
  const kutu = document.getElementById("acik-oneri");
  if (kutu) {
    const q = v.trim().toLocaleLowerCase("tr");
    if (q.length < 2) { kutu.innerHTML = ""; }
    else {
      const eslesen = isimListesi().filter(n => n.toLocaleLowerCase("tr").indexOf(q) >= 0).slice(0,6);
      kutu.innerHTML = eslesen.length
        ? '<div style="background:#1B1D28;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 16px rgba(0,0,0,.35)">'
          + eslesen.map(n => '<div style="padding:10px 12px;font-size:14px;border-bottom:1px solid #262837;cursor:pointer" onclick="aciklamaSec(\''+jsStr(n)+'\')">'+esc(n)+'</div>').join("")
          + '</div>'
        : "";
    }
  }
  const fiyatKutu = document.getElementById("musteri-fiyat-bilgi");
  if (fiyatKutu) fiyatKutu.innerHTML = musteriFiyatBilgiHtml(v);
}

function aciklamaSec(n) {
  form.aciklama = n;
  const inp = document.getElementById("f-acik");
  if (inp) inp.value = n;
  const kutu = document.getElementById("acik-oneri");
  if (kutu) kutu.innerHTML = "";
  const fiyatKutu = document.getElementById("musteri-fiyat-bilgi");
  if (fiyatKutu) fiyatKutu.innerHTML = musteriFiyatBilgiHtml(n);
}

// Bir müşterinin (normalize edilmiş isimle) geçmiş satışlarını en yeniden eskiye sıralı döner
function musteriSonSatislar(isim, adet) {
  const normalized = normMusteri((isim||"").trim());
  if (!normalized) return [];
  return data.hareketler
    .filter(h => h.gelir && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış") && normMusteri(h.aciklama) === normalized)
    .sort((a,b) => b.tarih.localeCompare(a.tarih) || (b.__id > a.__id ? 1 : -1))
    .slice(0, adet||3);
}

// Sadece satış (GELİR + Satış-Fatura/Perakende Satış) bağlamında, o müşteriye son verilen fiyatları gösteren kutu
function musteriFiyatBilgiHtml(isim) {
  const stokSecimSuan = form && form.tur === "GELİR" && (form.kategori === "Satış-Fatura" || form.kategori === "Perakende Satış");
  if (!stokSecimSuan || !isim || !isim.trim()) return "";
  const satislar = musteriSonSatislar(isim, 3);
  if (!satislar.length) return "";
  const satirlar = satislar.map(h => {
    const kgVar = h.kg && h.kg > 0;
    const fiyatKg = kgVar ? (h.gelir / (h.kg * 1.2)) : null;
    return '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid #262837;font-size:12.5px">'

      + '<span style="flex:1;text-align:center;color:var(--mut)">'+(kgVar?fmtKg(h.kg)+' kg':'—')+(h.urunTipi?' · '+esc(h.urunTipi):'')+'</span>'
      + '<span style="font-weight:800;color:var(--amber);white-space:nowrap">'+(fiyatKg!=null?fmt(fiyatKg)+'/kg':'—')+'</span>'
      + '<span style="font-weight:800;color:var(--green);white-space:nowrap">'+fmt(h.gelir)+'</span>'
      + '</div>';
  }).join("");
  return '<div style="background:#1B1D28;border:1px solid var(--amber);border-radius:10px;padding:9px 11px;margin-top:6px">'
    + '<div class="mini" style="font-weight:800;margin-bottom:4px;color:var(--amber)">💰 '+esc(normMusteri(isim.trim()))+' — Son Satışlar</div>'
    + satirlar
    + '<div class="mini" style="margin-top:4px">₺/kg değeri fatura toplamından hesaplanan ortalamadır (karışık kalem satıldıysa yaklaşık değer verir).</div>'
    + '</div>';
}

function setTur(t) {
  form.tur = t;
  form.kategori = t === "GELİR" ? GELIR_KAT[0] : GIDER_KAT[0];
  form.kalemler = [];
  render();
}
function fSet(k,v) { form[k] = v; }
function kalemEkle() { if (!form.kalemler) form.kalemler = []; form.kalemler.push({stokIdx:"", adet:"", kg:"", fiyatTuru:"kg", fiyat:""}); render(); }
function kalemSil(i) { form.kalemler.splice(i,1); render(); }
function kalemSet(i,k,v) { form.kalemler[i][k] = v; }
function kalemStokSec(i, v) {
  if (v === "__yeni") {
    window.__yeniUrunKalem = i; // yeni ürün kaydedilince bu satıra seçilecek
    urunModal(null);
    return;
  }
  form.kalemler[i].stokIdx = v;
  // Ürün seçilince liste fiyatını, o satırın seçili fiyat türüne (adet/kg) göre otomatik öner
  const m = data.mamul[parseInt(v)];
  if (m && !form.kalemler[i].fiyat) {
    const kgFiyat = fiyatBul(m.kalite);
    if (kgFiyat > 0) {
      const turSuan = form.kalemler[i].fiyatTuru || "kg";
      const onerilen = turSuan === "adet" ? (kgFiyat * (m.kgBobin||0)) : kgFiyat;
      form.kalemler[i].fiyat = String(Math.round(onerilen*100)/100).replace(".", ",");
    }
  }
  render();
}
// Fiyat Türü (Adet Fiyatı ⇄ Kg Fiyatı) değişince, girilmiş fiyatı yeni türe göre otomatik çevirir (kafa karışmasın diye)
function kalemFiyatTuruDegistir(i, yeniTuru) {
  const kal = form.kalemler[i];
  if (!kal || kal.fiyatTuru === yeniTuru) return;
  const m = data.mamul[parseInt(kal.stokIdx)];
  const eskiFiyat = parseTL(kal.fiyat);
  if (m && m.kgBobin > 0 && !isNaN(eskiFiyat) && eskiFiyat > 0) {
    let yeniFiyat;
    if (kal.fiyatTuru === "kg" && yeniTuru === "adet") yeniFiyat = eskiFiyat * m.kgBobin;   // ₺/kg -> ₺/adet
    else if (kal.fiyatTuru === "adet" && yeniTuru === "kg") yeniFiyat = eskiFiyat / m.kgBobin; // ₺/adet -> ₺/kg
    if (yeniFiyat != null) kal.fiyat = String(Math.round(yeniFiyat*100)/100).replace(".", ",");
  }
  kal.fiyatTuru = yeniTuru;
  render();
}
// Bir kalemin toplam kg'sini ve KDV dahil tutarını hesaplar.
// Net Kg elle girilmişse (gerçek tartım) onu kullanır; girilmemişse adet × kgBobin (katalog tahmini) kullanılır.
// Fiyat, seçili fiyat türüne göre yorumlanır: "adet" ise ₺/adet × adet; "kg" ise ₺/kg × net kg.
// Stoktan düşülecek adet HER ZAMAN kullanıcının girdiği adet'tir — fiyatlandırma türünden bağımsızdır.
function kalemKgTutar(k) {
  const m = data.mamul[parseInt(k.stokIdx)];
  const adet = parseTL(k.adet);
  if (!m || isNaN(adet) || adet <= 0) return { kg: 0, tutar: 0, adet: 0, kgGercekMi: false };
  const kgGirilen = parseTL(k.kg);
  const kgGercekMi = !isNaN(kgGirilen) && kgGirilen > 0;
  const kg = kgGercekMi ? kgGirilen : adet * (m.kgBobin||0);
  const fiyat = parseTL(k.fiyat);
  let tutar = 0;
  if (!isNaN(fiyat) && fiyat > 0) tutar = (k.fiyatTuru === "adet") ? (adet * fiyat * 1.2) : (kg * fiyat * 1.2);
  return { kg, tutar, adet, kgGercekMi };
}

function fiyatBul(kalite) {
  const f = data.fiyatlar.find(x => x.urun.indexOf("Hammadde") < 0 && x.urun.indexOf(kalite) === 0);
  return f ? f.kdvHaric : 0;
}

// Hammadde satırı için fiyat listesinde eşleşen kaydı bulur (tedarikçi + açıklama, yoksa sadece tedarikçi)
function hamFiyatBul(h) {
  const tedFold = trFold(h.tedarikci);
  const acikFold = trFold(h.aciklama || "");
  let f = data.fiyatlar.find(x => trFold(x.urun).indexOf(tedFold) >= 0 && acikFold !== "-" && acikFold !== "" && trFold(x.urun).indexOf(acikFold) >= 0);
  if (!f) f = data.fiyatlar.find(x => trFold(x.urun).indexOf(tedFold) >= 0);
  return f ? f.kdvHaric : 0;
}

function tutarOner() {
  let t = 0;
  (form.kalemler||[]).forEach(k => { t += kalemKgTutar(k).tutar; });
  return t;
}
function tutarOneriKullan() {
  form.tutar = tutarOner().toFixed(2).replace(".", ",");
  render();
}
function kalemToplamKg() {
  let kg = 0;
  (form.kalemler||[]).forEach(k => { kg += kalemKgTutar(k).kg; });
  return kg;
}
function satisKgOneriKullan() {
  form.satisKg = kalemToplamKg().toFixed(2).replace(".", ",");
  render();
}

function kaydet() {
  const t = parseTL(form.tutar);
  if (!form.aciklama.trim()) { toast("Açıklama gerekli"); return; }
  if (isNaN(t) || t <= 0) { toast("Geçerli bir tutar girin"); return; }
  const gelirMi = form.tur === "GELİR";

  // Stoktan düşme — YALNIZCA satış kategorisi seçiliyken (kategori sonradan değiştiyse düşme yapılmaz)
  const stokSecimK = gelirMi && (form.kategori === "Satış-Fatura" || form.kategori === "Perakende Satış");

  // Satış kg zorunlu — kullanıcı elle girmeden veya "Kg'ye Yaz" ile onaylamadan kaydetme
  let satisKgDeger = null;
  if (stokSecimK) {
    satisKgDeger = parseTL(form.satisKg);
    if (isNaN(satisKgDeger) || satisKgDeger <= 0) { toast("Satış Kg gerekli — elle girin veya \"Kg'ye Yaz\" ile onaylayın"); return; }
  }

  const gecerliKalemler = stokSecimK ? (form.kalemler||[]).filter(k => k.stokIdx !== "" && parseTL(k.adet) > 0) : [];

  // Her kalem için: stoktan düşülecek adet HER ZAMAN kullanıcının girdiği bobin sayısıdır (gerçek kg'den bağımsız —
  // 2. Kalite gibi ürünlerde tartılan net kg fiyatlandırmayı belirler, ama stoktan tam olarak girilen adet düşer)
  const kalemDusum = gecerliKalemler.map(k => {
    const m = data.mamul[parseInt(k.stokIdx)];
    const hesap = kalemKgTutar(k);
    return {m, kg: hesap.kg, dusulecekAdet: hesap.adet, kgGercekMi: hesap.kgGercekMi};
  });

  // Stok yetersizliği uyarısı
  for (const {m, dusulecekAdet} of kalemDusum) {
    if (m && dusulecekAdet > m.adet) {
      if (!confirm(m.kalite+" "+m.tip+" "+m.genislik+" stoğu "+fmtKg(m.adet)+" bobin — "+fmtKg(dusulecekAdet)+" bobin karşılığı satış girildi. Stok eksiye düşecek, devam edilsin mi?")) return;
    }
  }

  const kalemKayit = [];
  kalemDusum.forEach(({m, kg, dusulecekAdet, kgGercekMi}) => {
    if (m && dusulecekAdet > 0) {
      m.adet -= dusulecekAdet;
      const satir = {key: m.kalite+"|"+m.tip+"|"+m.genislik+"|"+m.gramaj, adet: dusulecekAdet, ad: m.kalite+" "+m.tip+" "+m.genislik};
      // Sadece GERÇEKTEN tartılıp girilen net kg saklanır — ileride "ortalama kg/bobin" hesaplarında
      // katalog tahmini yerine senin girdiğin gerçek değerler kullanılabilsin diye.
      if (kgGercekMi) satir.kg = kg;
      kalemKayit.push(satir);
    }
  });

  // Ürün tipini otomatik belirle: satılan ürünlerin kalitesinden
  let otomatikUrunTipi = null;
  if (kalemDusum.length) {
    const kaliteler = new Set(kalemDusum.filter(k => k.m).map(k => k.m.kalite));
    if (kaliteler.size === 1) otomatikUrunTipi = [...kaliteler][0];
    else if (kaliteler.size > 1) otomatikUrunTipi = "Karışık";
  }

  // Hammadde alımı — kalan stok artar
  if (!gelirMi && form.kategori === "Hammadde" && form.hamIdx !== "") {
    const hm = data.hammadde[parseInt(form.hamIdx)];
    const kg = parseTL(form.hamKg);
    if (hm && !isNaN(kg) && kg > 0) {
      hm.kalan = (hm.kalan||0) + kg;
      hm.alinan = (hm.alinan||0) + kg;
    }
  }

  const kayit = {
    tarih: form.tarih,
    tur: form.tur,
    aciklama: form.aciklama.trim(),
    kategori: form.kategori,
    gelir: gelirMi ? t : null,
    gider: gelirMi ? null : t,
    not: form.not.trim() || null,
    __id: "h_" + Date.now() + "_" + Math.random().toString(36).slice(2,7)
  };
  if (stokSecimK) {
    kayit.kg = satisKgDeger;
    if (form.vade) { kayit.vade = form.vade; kayit.odendi = false; }
    const nihaiUrunTipi = otomatikUrunTipi || form.urunTipi || null;
    if (nihaiUrunTipi) kayit.urunTipi = nihaiUrunTipi;
    if (kalemKayit.length) kayit.kalemler = kalemKayit;
    // Kâr hesabında kullanılan maliyet varsayımlarını BU ANDAKİ değerleriyle satışa damgalar —
    // böylece ileride işçilik/masura/hammadde fiyatı değişse bile bu satışın kârı geçmişte
    // kaldığı gibi hesaplanmaya devam eder (geriye dönük değişmez).
    kayit.maliyetSnapshot = {
      iscilik: Object.assign({}, data.ayarlar.iscilik),
      masuraFiyat: data.ayarlar.masuraFiyat,
      hammaddeFiyat: { "1. Kalite": ortalamaHammaddeFiyati("1. Kalite"), "2. Kalite": ortalamaHammaddeFiyati("2. Kalite"), "ECO-1": ortalamaHammaddeFiyati("ECO-1") }
    };
  }
  data.hareketler.push(kayit);
  // Yeni satışta müşterinin pozitif cari bakiyesi (önceki fazla ödemesi) varsa otomatik uygulanır
  let cariMesaji = "";
  if (kayit.gelir && (kayit.kategori === "Satış-Fatura" || kayit.kategori === "Perakende Satış" || kayit.vade)) {
    const cariAnahtar = normMusteri(kayit.aciklama);
    const mevcutKredi = data.cariBakiyeler[cariAnahtar] || 0;
    if (mevcutKredi > 0.01) {
      const uygulanan = Math.min(mevcutKredi, kayit.gelir);
      if (!kayit.tahsilatlar) kayit.tahsilatlar = [];
      kayit.tahsilatlar.push({ tarih: kayit.tarih, tutar: uygulanan });
      data.cariBakiyeler[cariAnahtar] = mevcutKredi - uygulanan;
      if (data.cariBakiyeler[cariAnahtar] < 0.01) delete data.cariBakiyeler[cariAnahtar];
      kayit.odendi = tahsilatDurumu(kayit).tamamlandiMi;
      cariMesaji = " · "+fmt(uygulanan)+" cari bakiyeden otomatik düşüldü";
    }
  }
  save();
  resetForm();
  toast("✓ Kayıt eklendi"+cariMesaji);
  tab = "hareketler";
  hFiltre = "tumu";
  arama = "";
  render();
}

    tartim = {
      firma: "", tarih: yerelTarihStr(),

      kapasite: "120 cm", fiyatKg: "55", stokIdx: "",

}

function tartimKaydet() {
  try { localStorage.setItem("raz-tartim-v1", JSON.stringify(tartim)); } catch(e) {}
}

function tartimOzetHesapla() {
  let brutT = 0, adet = 0;
  tartim.satirlar.forEach(s => {
    brutT += s.brut;
    adet += 1;
  });
  return {brutT, adet};
}

  const v = parseTL(deger);
  if (isNaN(v) || v <= 0) { toast("Geçerli kg girin"); return; }
  tartim.satirlar.push({brut: v});
  tartimKaydet();
  render();
  setTimeout(() => {

    if (inp) { inp.value = ""; inp.focus(); }

  tartim.satirlar.splice(i,1);

  }];

}

// Bir üretim formunun anlık hesaplarını döner: toplam üretilen kg, toplam hammadde kg, verimlilik %
function uHesapla(f) {
  let uretilenKg = 0;
  (f.urunler||[]).forEach(u => {
    const m = data.mamul[parseInt(u.mamulIdx)];
    const adet = parseTL(u.adet);
    if (m && !isNaN(adet) && adet > 0) uretilenKg += adet * (m.kgBobin||0);
  });
  let hammaddeKg = 0;
  (f.hammaddeler||[]).forEach(h => {
    const kg = parseTL(h.kg);
    if (h.hamIdx !== "" && !isNaN(kg) && kg > 0) hammaddeKg += kg;
  });
  const verimlilik = (uretilenKg > 0 && hammaddeKg > 0) ? (uretilenKg / hammaddeKg * 100) : null;
  return { uretilenKg, hammaddeKg, verimlilik };
}

function uretimKaydet() {
  if (!uForm.usta.trim()) { toast("Usta adı gerekli"); return; }
  const saat = parseTL(uForm.saat);
  if (isNaN(saat) || saat <= 0) { toast("Çalışma saati gerekli"); return; }
  const gecerliUrunler = (uForm.urunler||[]).filter(u => u.mamulIdx !== "" && parseTL(u.adet) > 0);
  if (!gecerliUrunler.length) { toast("En az bir üretilen ürün girin"); return; }
  const gecerliHammaddeler = (uForm.hammaddeler||[]).filter(h => h.hamIdx !== "" && parseTL(h.kg) > 0);

  // Hammadde yetersizliği uyarısı
  for (const h of gecerliHammaddeler) {
    const hm = data.hammadde[parseInt(h.hamIdx)];
    const kg = parseTL(h.kg);
    if (hm && kg > hm.kalan) {
      if (!confirm(hm.tedarikci+" "+(hm.aciklama!=="-"?hm.aciklama:"")+" stoğu "+fmtKg(hm.kalan)+" kg — "+fmtKg(kg)+" kg kullanım girildi. Stok eksiye düşecek, devam edilsin mi?")) return;
    }
  }

  const urunKayit = [];
  gecerliUrunler.forEach(u => {
    const m = data.mamul[parseInt(u.mamulIdx)];
    const adet = parseTL(u.adet);
    if (m && adet > 0) {
      m.adet += adet;
      urunKayit.push({ key: m.kalite+"|"+m.tip+"|"+m.genislik+"|"+m.gramaj, ad: m.kalite+" "+m.tip+" "+m.genislik, adet, kg: adet * (m.kgBobin||0) });
    }
  });
  const hamKayit = [];
  gecerliHammaddeler.forEach(h => {
    const hm = data.hammadde[parseInt(h.hamIdx)];
    const kg = parseTL(h.kg);
    if (hm && kg > 0) {
      hm.kalan -= kg;
      hamKayit.push({ key: hm.tedarikci+"|"+hm.aciklama, ad: hm.tedarikci+(hm.aciklama!=="-"?" ("+hm.aciklama+")":""), kg });
    }
  });

  const uretilenKg = urunKayit.reduce((s,u) => s + u.kg, 0);
  const hammaddeKg = hamKayit.reduce((s,h) => s + h.kg, 0);
  const verimlilik = (uretilenKg > 0 && hammaddeKg > 0) ? (uretilenKg / hammaddeKg * 100) : null;

  const kayit = {
    __id: "u_" + Date.now() + "_" + Math.random().toString(36).slice(2,7),
    tarih: uForm.tarih,
    vardiya: uForm.vardiya,
    makine: uForm.makine,
    usta: uForm.usta.trim(),
    saat: saat,
    not: uForm.not.trim() || null,
    urunler: urunKayit,
    hammaddeler: hamKayit,
    uretilenKg, hammaddeKg, verimlilik
  };
  if (!data.uretimler) data.uretimler = [];
  data.uretimler.push(kayit);
  save();
  resetUForm();
  toast("✓ Üretim kaydı eklendi");
  render();
}

function uretimSil(idx) {
  const u = data.uretimler[idx];
  if (!u) return;
  if (!confirm(fmtTarih(u.tarih)+" · "+u.vardiya+" vardiyası · "+u.makine+" — bu üretim kaydı silinsin mi?")) return;
  if ((u.urunler&&u.urunler.length) || (u.hammaddeler&&u.hammaddeler.length)) {
    const ozet = (u.urunler||[]).map(x => "+ "+x.ad+" × "+x.adet+" bobin (üretimden)").concat(
      (u.hammaddeler||[]).map(x => "− "+x.ad+" × "+fmtKg(x.kg)+" kg (hammaddeden)")
    ).join("\n");
    if (confirm("Bu kayıtta stok değişiklikleri var:\n"+ozet+"\n\nStoklar geri alınsın mı? (Üretilen bobinler stoktan düşülür, kullanılan hammadde geri eklenir)")) {
      (u.urunler||[]).forEach(x => {
        const m = data.mamul.find(m => m.kalite+"|"+m.tip+"|"+m.genislik+"|"+m.gramaj === x.key);
        if (m) m.adet -= x.adet;
      });
      (u.hammaddeler||[]).forEach(x => {
        const h = data.hammadde.find(h => h.tedarikci+"|"+h.aciklama === x.key);
        if (h) h.kalan += x.kg;
      });
    }
  }
  data.uretimler.splice(idx,1);
  save(); render();
  toast("Üretim kaydı silindi");
}

// Belirli bir ay için üretim özet istatistikleri (Üretim sekmesi KPI'ları ve Aylık Rapor'da kullanılır)
function uretimAyOzeti(ayKey) {
  const kayitlar = (data.uretimler||[]).filter(u => u.tarih.slice(0,7) === ayKey);
  let toplamBobin = 0, toplamSaat = 0, toplamUretilenKg = 0, toplamHammaddeKg = 0;
  const makineSaat = {}; MAKINELER.forEach(m => makineSaat[m] = 0);
  const vardiyaSaat = {}; VARDIYALAR.forEach(v => vardiyaSaat[v] = {saat:0, bobin:0, vardiyaSayisi:0});
  const ustaOzet = {};
  kayitlar.forEach(u => {
    toplamSaat += u.saat||0;
    toplamUretilenKg += u.uretilenKg||0;
    toplamHammaddeKg += u.hammaddeKg||0;
    (u.urunler||[]).forEach(x => toplamBobin += x.adet);
    makineSaat[u.makine] = (makineSaat[u.makine]||0) + (u.saat||0);
    if (!vardiyaSaat[u.vardiya]) vardiyaSaat[u.vardiya] = {saat:0, bobin:0, vardiyaSayisi:0};
    vardiyaSaat[u.vardiya].saat += u.saat||0;
    vardiyaSaat[u.vardiya].vardiyaSayisi += 1;
    (u.urunler||[]).forEach(x => vardiyaSaat[u.vardiya].bobin += x.adet);
    if (!ustaOzet[u.usta]) ustaOzet[u.usta] = {vardiyaSayisi:0, saat:0, bobin:0};
    ustaOzet[u.usta].vardiyaSayisi += 1;
    ustaOzet[u.usta].saat += u.saat||0;
    (u.urunler||[]).forEach(x => ustaOzet[u.usta].bobin += x.adet);
  });
  const ortVerimlilik = (toplamUretilenKg > 0 && toplamHammaddeKg > 0) ? (toplamUretilenKg / toplamHammaddeKg * 100) : null;
  return { kayitlar, toplamBobin, toplamSaat, toplamUretilenKg, toplamHammaddeKg, ortVerimlilik, makineSaat, vardiyaSaat, ustaOzet };
}

// 2. Kalite bobinlerin satışında faturaya yansıyan ama hammadde maliyeti ödenmeyen masura (karton/plastik göbek)
// ağırlığını hesaplar. Sadece stoktan ürün seçilerek yapılan satışlar (kalemler dolu) hesaba katılabilir,
// çünkü genişlik (ve dolayısıyla masura kg'si) sadece o kayıtlardan bilinir.
// Yalnızca SATIŞ (üretim değil) kayıtlarına bakar — Hasan'ın önceliği ürettiği değil sattığı miktardır.
//
// Hesap tamamen BOBİN SAYISI üzerinden: her genişliğin sabit masura kilosu (MASURALAR) bobin adediyle
// çarpılır. Tartımda tek tek girilen brüt kilolar (12,4 / 12,5 / 12,7 / 11,8 gibi) burada ortalamaya
// katılmaz — önemli olan kaç bobin satıldığı ve o genişliğin sabit masura kilosu.
function masuraAnaliziAy(ayKey) {
  const tumSatislar = data.hareketler.filter(h => h.tarih.slice(0,7) === ayKey && h.gelir && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış"));
  const satislar = tumSatislar.filter(h => h.kalemler && h.kalemler.length);
  const eksikSatislar = tumSatislar.filter(h => !h.kalemler || !h.kalemler.length);

  let toplamBobin = 0, toplamBobinKg = 0, toplamMasuraKg = 0, tanimsizBobin = 0;
  const genislikKirilim = {};
  const tanimsizKirilim = {}; // genişlik -> {adet, ad} — hangi ürün(ler) eşleşmedi, açıkça göstermek için
  satislar.forEach(h => {
    (h.kalemler||[]).forEach(k => {
      const parcalar = String(k.key||"").split("|");
      const kalite = parcalar[0], genislik = parcalar[2];
      if (kalite !== "2. Kalite") return;
      const mas = masuraBul(genislik);
      if (!mas) {
        tanimsizBobin += (k.adet||0);
        if (!tanimsizKirilim[genislik]) tanimsizKirilim[genislik] = {adet:0, ad:k.ad||("2. Kalite · "+genislik)};
        tanimsizKirilim[genislik].adet += (k.adet||0);
        return;
      }
      const adet = k.adet||0;
      const masuraKg = adet * mas.masura;   // bobin sayısı × sabit masura kilosu
      const bobinKg = adet * mas.bobin;     // bobin sayısı × sabit standart bobin kilosu
      toplamBobin += adet;
      toplamMasuraKg += masuraKg;
      toplamBobinKg += bobinKg;
      if (!genislikKirilim[genislik]) genislikKirilim[genislik] = {adet:0, masuraKg:0, bobinKg:0};
      genislikKirilim[genislik].adet += adet;
      genislikKirilim[genislik].masuraKg += masuraKg;
      genislikKirilim[genislik].bobinKg += bobinKg;
    });
  });
  const netPlastikKg = toplamBobinKg - toplamMasuraKg;
  const masuraOrani = toplamBobinKg > 0 ? (toplamMasuraKg / toplamBobinKg * 100) : null;
  return { toplamBobin, toplamBobinKg, toplamMasuraKg, netPlastikKg, masuraOrani, genislikKirilim, tanimsizBobin, tanimsizKirilim, eksikSatislar };
}

// Bu ay hangi üründen kaç adet satıldığını hesaplar (adet birincil metrik).
// Sadece stoktan ürün seçilerek yapılan satışlar (kalemler dolu) sayılabilir —
// tanimliOlmayanSatisSayisi, ürün seçilmeden yapılmış satış adedini gösterir (bilgi amaçlı).
function urunSatisAyOzeti(ayKey) {
  const tumSatislar = data.hareketler.filter(h => h.tarih.slice(0,7) === ayKey && h.gelir && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış"));
  const satislar = tumSatislar.filter(h => h.kalemler && h.kalemler.length);
  const tanimliOlmayanSatisSayisi = tumSatislar.length - satislar.length;

  const urunler = {};
  satislar.forEach(h => {
    (h.kalemler||[]).forEach(k => {
      if (!urunler[k.key]) urunler[k.key] = { ad: k.ad, adet: 0, kg: 0, islemSayisi: 0 };
      const adet = k.adet||0;
      urunler[k.key].adet += adet;
      if (k.kg != null) {
        urunler[k.key].kg += k.kg;
      } else {
        const m = data.mamul.find(mm => mm.kalite+"|"+mm.tip+"|"+mm.genislik+"|"+mm.gramaj === k.key);
        urunler[k.key].kg += adet * (m ? (m.kgBobin||0) : 0);
      }
      urunler[k.key].islemSayisi += 1;
    });
  });
  return { urunler, tanimliOlmayanSatisSayisi };
}

// ============ ÜRÜNLE EŞLEŞTİRME (GEÇMİŞE DÖNÜK, STOĞA DOKUNMADAN) ============
// Ürün seçilmeden yapılmış eski bir satışa, sadece RAPORLARDA (masura, ürün bazlı satış, kârlılık)
// doğru sayılması için kalemler bilgisi ekler. Stoğa KASITLI OLARAK dokunmaz — çünkü satış zaten
// geçmişte yapılmış, stok o zaman zaten düştüyse tekrar düşürmek çift düşüm hatasına yol açar.
// Satışın notundan/açıklamasından genişlik ve adet tahmini yapar (Tartım aracının otomatik
// oluşturduğu "X bobin (tartımdan)" ve "160cm" gibi ibareleri yakalar) — eşleştirmeyi hızlandırmak için.
function metindenGenislikTahminEt(metin) {
  const m = String(metin||"").match(/(120|145|160)\s*cm/i);
  return m ? m[1]+" cm" : null;
}
function metindenAdetTahminEt(metin) {
  const m = String(metin||"").match(/(\d+)\s*(bobin|adet)/i);
  return m ? parseInt(m[1]) : null;
}
// Bir satışın masura/ürün raporlarına dahil olması için ürünle eşleştirilmesi gerekip gerekmediğini söyler.
function urunEslestirmeGerekiyorMu(h) {
  return h.tur === "GELİR" && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış") && (!h.kalemler || !h.kalemler.length);
}

function urunEslestirModal(hId) {
  window.__urunEslestirHedefId = hId;
  const h = data.hareketler.find(x => x.__id === hId);
  const metin = (h ? (h.not||"")+" "+(h.aciklama||"") : "");
  const tahminGenislik = metindenGenislikTahminEt(metin);
  const tahminAdet = metindenAdetTahminEt(metin);
  let baslangicStokIdx = "";
  let tekEslesme = false;
  if (tahminGenislik) {
    const eslesenler = data.mamul.map((m,i) => ({m,i})).filter(x => x.m.kalite === "2. Kalite" && genislikNormalize(x.m.genislik) === genislikNormalize(tahminGenislik));
    if (eslesenler.length === 1) { baslangicStokIdx = String(eslesenler[0].i); tekEslesme = true; }
  }
  window.__urunEslestirKalemler = [{stokIdx: baslangicStokIdx, adet: tahminAdet ? String(tahminAdet) : ""}];
  window.__urunEslestirTahmin = { genislik: tahminGenislik, adet: tahminAdet, tekEslesme };
  const overlay = document.createElement("div");
  overlay.id = "urun-eslestir-modal";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(6,5,14,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";
  overlay.innerHTML = urunEslestirIcerik();
  document.body.appendChild(overlay);
}

function urunEslestirIcerik() {
  const h = data.hareketler.find(x => x.__id === window.__urunEslestirHedefId);
  if (!h) return "";
  const tahmin = window.__urunEslestirTahmin || {};
  let html = '<div style="background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto">';
  html += '<div class="mtitle">🔧 Ürünle Eşleştir</div>';
