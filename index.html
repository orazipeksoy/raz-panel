function urunEslestirSet(i,k,v) {
  window.__urunEslestirKalemler[i][k] = v;
  const el = document.getElementById("urun-eslestir-modal");
  if (el) el.innerHTML = urunEslestirIcerik();
}
function urunEslestirEkle() {
  window.__urunEslestirKalemler.push({stokIdx:"", adet:""});
  const el = document.getElementById("urun-eslestir-modal");
  if (el) el.innerHTML = urunEslestirIcerik();
}
function urunEslestirSil(i) {
  window.__urunEslestirKalemler.splice(i,1);
  const el = document.getElementById("urun-eslestir-modal");
  if (el) el.innerHTML = urunEslestirIcerik();
}

function urunEslestirKaydet() {
  const h = data.hareketler.find(x => x.__id === window.__urunEslestirHedefId);
  if (!h) return;
  const gecerli = (window.__urunEslestirKalemler||[]).filter(k => k.stokIdx !== "" && parseTL(k.adet) > 0);
  if (!gecerli.length) { toast("En az bir ürün ve adet girin"); return; }
  const kalemKayit = gecerli.map(k => {
    const m = data.mamul[parseInt(k.stokIdx)];
    return { key: m.kalite+"|"+m.tip+"|"+m.genislik+"|"+m.gramaj, adet: parseTL(k.adet), ad: m.kalite+" "+m.tip+" "+m.genislik };
  });
  h.kalemler = kalemKayit;
  const kaliteler = new Set(kalemKayit.map(k => k.key.split("|")[0]));
  if (kaliteler.size === 1 && !h.urunTipi) h.urunTipi = Array.from(kaliteler)[0];
  save();
  urunEslestirModalKapat();
  render();
  toast("✓ Eşleştirildi — rapor artık bu satışı da sayıyor");
}

function urunEslestirModalKapat() {
  const el = document.getElementById("urun-eslestir-modal");
  if (el) el.remove();
  window.__urunEslestirHedefId = null;
  window.__urunEslestirKalemler = null;
  window.__urunEslestirTahmin = null;
}

// ============ KÂRLILIK HESAPLAMA (TAHMİNİ) ============
// Satışlarda hangi hammaddeden üretildiği izlenmediği için gerçek/kesin maliyet hesaplanamaz.
// Bunun yerine, o KALİTE için etiketlenmiş hammaddelerin AĞIRLIKLI ORTALAMA fiyatını kullanarak
// makul bir tahmini maliyet/kâr hesabı yapılır (hammadde stok kalemlerine "hangi kalite için"
// etiketi eklenmiş olması gerekir — eklenmemişse "Genel" sayılır ve tüm hesaplarda kullanılır).
// Muhasebenin verdiği kesin rakamların yerine geçmez — sadece hızlı bir sağlama/karşılaştırma aracıdır.
function ortalamaHammaddeFiyati(kaliteFiltre) {
  let toplamDeger = 0, toplamKg = 0;
  data.hammadde.forEach(h => {
    if (kaliteFiltre && h.kalite && h.kalite !== "Genel" && h.kalite !== kaliteFiltre) return;
    const fiyat = hamFiyatBul(h);
    const agirlik = (h.alinan != null && h.alinan > 0) ? h.alinan : (h.kalan||0);
    if (fiyat > 0 && agirlik > 0) { toplamDeger += fiyat * agirlik; toplamKg += agirlik; }
  });
  if (toplamKg > 0) return toplamDeger / toplamKg;
  if (!kaliteFiltre) return 0;
  // Bu kalite için etiketli hiç hammadde yoksa (henüz etiketlenmemiş) — son çare olarak genel ortalamaya düş
  let g = 0, k = 0;
  data.hammadde.forEach(h => {
    const fiyat = hamFiyatBul(h);
    const agirlik = (h.alinan != null && h.alinan > 0) ? h.alinan : (h.kalan||0);
    if (fiyat > 0 && agirlik > 0) { g += fiyat * agirlik; k += agirlik; }
  });
  return k > 0 ? (g / k) : 0;
}

// Bir satış kaydının tahmini kârını hesaplar (KDV hariç gelir üzerinden).
function satisKarHesapla(h) {
  if (!h.gelir) return null;
  const gelirKdvHaric = h.gelir / 1.2;
  // Satışta damgalanmış maliyet anlık görüntüsü varsa ONU kullan (o satışın gerçek zamanındaki
  // fiyatlarla hesaplanmaya devam etmesi için) — yoksa (eski kayıt) şu anki ayarlara düşer.
  const snap = h.maliyetSnapshot;
  // hammaddeFiyat artık kalite bazlı bir sözlük (yeni format) — eski kayıtlarda tek sayıydı, ikisini de destekler.
  const hamFiyatSozluk = (snap && snap.hammaddeFiyat && typeof snap.hammaddeFiyat === "object") ? snap.hammaddeFiyat : null;
  const hamFiyatEskiTekil = (snap && typeof snap.hammaddeFiyat === "number") ? snap.hammaddeFiyat : null;
  const iscilikSozluk = (snap && snap.iscilik && typeof snap.iscilik === "object") ? snap.iscilik : data.ayarlar.iscilik;
  const masuraOrani = snap ? snap.masuraFiyat : data.ayarlar.masuraFiyat;

  let toplamKg = 0, masuraKg = 0, iscilikMaliyeti = 0, hammaddeMaliyeti = 0;
  if (h.kalemler && h.kalemler.length) {
    // Her kalem KENDİ ürün tipine göre hesaplanır — karışık faturalarda bile doğru sonuç verir.
    h.kalemler.forEach(k => {
      const parcalar = String(k.key||"").split("|");
      const kalite = parcalar[0], genislik = parcalar[2];
      let kg = k.kg;
      if (kg == null) {
        const m = data.mamul.find(mm => mm.kalite+"|"+mm.tip+"|"+mm.genislik+"|"+mm.gramaj === k.key);
        kg = (k.adet||0) * (m ? (m.kgBobin||0) : 0);
      }
      toplamKg += kg;
      const mas = masuraBul(genislik);
      // Masura SADECE 2. Kalite'de var — 1. Kalite ve ECO-1 masurasız.
      const buKalemMasuraKg = (kalite === "2. Kalite" && mas) ? (k.adet||0) * mas.masura : 0;
      masuraKg += buKalemMasuraKg;
      const netPlastikBuKalem = Math.max(0, kg - buKalemMasuraKg);
      // İşçilik masura kilosuna VERİLMEZ — sadece net plastik kg üzerinden, o kalemin kendi kalitesinin oranıyla.
      const oran = (iscilikSozluk && iscilikSozluk[kalite] != null) ? iscilikSozluk[kalite] : 0;
      iscilikMaliyeti += netPlastikBuKalem * oran;
      // Hammadde fiyatı da kaliteye özel — 2. Kalite genelde daha ucuz/farklı hammaddeden üretildiği için
      // TÜM hammaddelerin genel ortalamasını değil, o kaliteye ETİKETLENMİŞ hammaddelerin ortalamasını kullanır.
      const hamFiyat = hamFiyatSozluk ? (hamFiyatSozluk[kalite] != null ? hamFiyatSozluk[kalite] : ortalamaHammaddeFiyati(kalite))
                      : (hamFiyatEskiTekil != null ? hamFiyatEskiTekil : ortalamaHammaddeFiyati(kalite));
      hammaddeMaliyeti += netPlastikBuKalem * hamFiyat;
    });
  } else {
    // Kalemleri yoksa (stok seçilmeden girilmiş satış) kalite tekil olarak bilinmez.
    // h.urunTipi belirliyse (otomatik ya da elle atanmış) o tipin oranını kullanır; "Karışık"/bilinmiyorsa
    // üç oranın ortalaması kullanılır — bu satırlar zaten tahminidir, masura ayrımı da yapılamaz.
    toplamKg = h.kg || 0;
    let oran, hamFiyat;
    if (h.urunTipi && iscilikSozluk && iscilikSozluk[h.urunTipi] != null) {
      oran = iscilikSozluk[h.urunTipi];
      hamFiyat = hamFiyatSozluk ? (hamFiyatSozluk[h.urunTipi] != null ? hamFiyatSozluk[h.urunTipi] : ortalamaHammaddeFiyati(h.urunTipi))
               : (hamFiyatEskiTekil != null ? hamFiyatEskiTekil : ortalamaHammaddeFiyati(h.urunTipi));
    } else {
      const degerler = Object.values(iscilikSozluk||{});
      oran = degerler.length ? degerler.reduce((s,v)=>s+v,0)/degerler.length : 0;
      hamFiyat = hamFiyatEskiTekil != null ? hamFiyatEskiTekil : ortalamaHammaddeFiyati();
    }
    iscilikMaliyeti = toplamKg * oran;
    hammaddeMaliyeti = toplamKg * hamFiyat; // masura ayrımı yapılamıyor bu durumda
  }
  const netPlastikKg = Math.max(0, toplamKg - masuraKg);
  const masuraMaliyeti = masuraKg * masuraOrani;
  const toplamMaliyet = hammaddeMaliyeti + iscilikMaliyeti + masuraMaliyeti;
  const kar = gelirKdvHaric - toplamMaliyet;
  const karMarji = gelirKdvHaric > 0 ? (kar / gelirKdvHaric * 100) : null;
  return { gelirKdvHaric, toplamKg, netPlastikKg, masuraKg, hammaddeMaliyeti, iscilikMaliyeti, masuraMaliyeti, toplamMaliyet, kar, karMarji };
}

// Belirli bir ay için toplam kârlılık özeti (ürün tipine göre kırılımlı).
function karlilikAyOzeti(ayKey) {
  const satislar = data.hareketler.filter(h => h.tarih.slice(0,7) === ayKey && h.gelir && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış"));
  let toplamGelir = 0, toplamMaliyet = 0, toplamKar = 0, toplamKg = 0;
  const urunTipiKirilim = {};
  satislar.forEach(h => {
    const k = satisKarHesapla(h);
    if (!k) return;
    toplamGelir += k.gelirKdvHaric;
    toplamMaliyet += k.toplamMaliyet;
    toplamKar += k.kar;
    toplamKg += k.toplamKg;
    const tip = h.urunTipi || "Bilinmeyen";
    if (!urunTipiKirilim[tip]) urunTipiKirilim[tip] = {gelir:0, maliyet:0, kar:0};
    urunTipiKirilim[tip].gelir += k.gelirKdvHaric;
    urunTipiKirilim[tip].maliyet += k.toplamMaliyet;
    urunTipiKirilim[tip].kar += k.kar;
  });
  const karMarji = toplamGelir > 0 ? (toplamKar / toplamGelir * 100) : null;
  return { toplamGelir, toplamMaliyet, toplamKar, karMarji, toplamKg, urunTipiKirilim, satisSayisi: satislar.length };
}

      + '<button class="sil-x" onclick="uHamSil('+hi+')">×</button>'
      + '</div>';
  });
  html += '<div><button class="chip" onclick="uHamEkle()">+ Hammadde Satırı Ekle</button></div></div>';

  // Üretilen ürün satırları

    html += '<div class="mini" style="font-size:13px">Bu kayıt için verimlilik: <b style="color:'+(anlik.verimlilik>=90?"var(--green)":"var(--amber)")+'">%'+anlik.verimlilik.toFixed(1)+'</b> ('+fmtKg(anlik.uretilenKg)+' kg üretim / '+fmtKg(anlik.hammaddeKg)+' kg hammadde)</div>';
  }
  html += '<div><div class="mini" style="margin-bottom:5px">Not (opsiyonel)</div><input type="text" placeholder="ör. arıza, mola, özel durum" value="'+esc(uForm.not)+'" oninput="uSet(\'not\',this.value)"></div>';
  html += '<button class="btn" style="background:var(--blue)" onclick="uretimKaydet()">Üretim Kaydını Ekle</button>';
  html += '</div></div>';

  // ---- Üretim geçmişi ----
  const filtreler = [["tumu","Tümü"],["buay","Bu Ay"],["makine1",MAKINELER[0]],["makine2",MAKINELER[1]],["gunduz","Gündüz"],["gece","Gece"]];
  let liste = (data.uretimler||[]).slice().sort((a,b) => b.tarih.localeCompare(a.tarih) || (b.__id>a.__id?1:-1));
  if (uFiltre === "buay") liste = liste.filter(u => u.tarih.slice(0,7) === buAyKey());
  else if (uFiltre === "makine1") liste = liste.filter(u => u.makine === MAKINELER[0]);
  else if (uFiltre === "makine2") liste = liste.filter(u => u.makine === MAKINELER[1]);
  else if (uFiltre === "gunduz") liste = liste.filter(u => u.vardiya === "Gündüz");
  else if (uFiltre === "gece") liste = liste.filter(u => u.vardiya === "Gece");

  // Performans için: çok uzun geçmişte bile ekran yavaşlamasın diye en fazla son 300 kayıt render edilir
  const uToplamSayi = liste.length;
  const kirpildi = liste.length > 300;
  if (kirpildi) liste = liste.slice(0, 300);

  html += '<div class="card"><div class="mtitle">Üretim Geçmişi <span class="pill">'+uToplamSayi+' kayıt</span></div>';
  html += '<div class="chips">'+filtreler.map(f => '<button class="chip'+(uFiltre===f[0]?" on":"")+'" onclick="uFiltre=\''+f[0]+'\';render()">'+f[1]+'</button>').join("")+'</div>';
  if (kirpildi) html += '<div class="mini" style="margin-bottom:8px">En son 300 kayıt gösteriliyor. Daha eskisini görmek için Excel/Aylık Rapor\'dan indir.</div>';
  html += '<div class="scroll"><table><tr><th>Tarih</th><th>Vardiya</th><th>Makine</th><th>Usta</th><th class="num">Saat</th><th>Ürünler</th><th>Hammadde</th><th class="num">Verim</th><th></th></tr>';
  liste.forEach(u => {
    const idx = data.uretimler.findIndex(x => x.__id === u.__id);
    const urunOzet = (u.urunler||[]).map(x => x.ad+" ×"+x.adet).join(", ");
    const hamOzet = (u.hammaddeler||[]).map(x => x.ad+" "+fmtKg(x.kg)+"kg").join(", ");
    html += '<tr>'
      + '<td style="white-space:nowrap">'+fmtTarih(u.tarih)+'</td>'
      + '<td>'+(u.vardiya==="Gündüz"?"☀️":"🌙")+' '+u.vardiya+'</td>'
      + '<td>'+esc(u.makine.replace(" Makinası",""))+'</td>'
      + '<td>'+esc(u.usta)+'</td>'
      + '<td class="num">'+fmtKg(u.saat)+'</td>'
      + '<td style="max-width:180px">'+esc(urunOzet)+(u.not?'<div class="notrow">'+esc(u.not)+'</div>':"")+'</td>'
      + '<td style="max-width:160px">'+esc(hamOzet)+'</td>'
      + '<td class="num">'+(u.verimlilik!=null?"%"+u.verimlilik.toFixed(0):"—")+'</td>'
      + '<td style="text-align:right"><button class="sil-x" onclick="uretimSil('+idx+')">×</button></td>'
      + '</tr>';
  });
  html += '</table></div></div>';
  return html;
}

// ============ HAREKETLER ============
function rHareketler(H) {
  const filtreler = [["tumu","Tümü"],["gelir","Gelir"],["gider","Gider"],["bekleyen","Bekleyen Tahsilat"],["buay","Bu Ay"]];

  else if (hFiltre === "bekleyen") liste = liste.filter(h => h.tur === "GELİR" && !tahsilatDurumu(h).tamamlandiMi && h.kategori !== "Sermaye" && h.kategori !== "Kredi Kullanımı" && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış" || h.vade));

function duzenleBaslat(id) { duzenleIdx = id; window.__editForm = {}; render(); }
function editSet(k,v) { if (!window.__editForm) window.__editForm = {}; window.__editForm[k] = v; }
function duzenleIptal() { duzenleIdx = null; window.__editForm = null; render(); }

function duzenleKaydet(id) {
  const h = data.hareketler.find(x => x.__id === id);
  if (!h) { duzenleIptal(); return; }
  const e = window.__editForm || {};
  if (e.tarih) h.tarih = e.tarih;
  if (e.kategori) h.kategori = e.kategori;
  if (e.aciklama != null) {
    if (!e.aciklama.trim()) { toast("Açıklama boş olamaz"); return; }
    h.aciklama = e.aciklama.trim();
  }
  if (e.tutar != null) {
    const t = parseTL(e.tutar);
    if (isNaN(t) || t <= 0) { toast("Geçerli tutar girin"); return; }
    if (h.tur === "GELİR") h.gelir = t; else h.gider = t;
  }
  if (e.kg != null) {
    const kg = parseTL(e.kg);
    h.kg = (!isNaN(kg) && kg > 0) ? kg : null;
  }
  if (e.vade != null) {
    h.vade = e.vade || null;
    if (h.vade && h.odendi == null) h.odendi = false;
  }
  if (e.not != null) h.not = e.not.trim() || null;
  duzenleIdx = null; window.__editForm = null;
  save(); render();
  toast("✓ Güncellendi");
}

// ============ TAHSİLAT (KISMİ ÖDEME DESTEKLİ) ============
// Bir satışın tahsilat durumunu hesaplar. h.tahsilatlar varsa (yeni sistem) onu kullanır;
// yoksa eski h.odendi boolean'ından (geriye dönük uyumluluk) türetir.
function tahsilatDurumu(h) {
  const gelir = h.gelir || 0;
  if (h.tahsilatlar && h.tahsilatlar.length) {
    const toplamTahsil = h.tahsilatlar.reduce((s,t) => s + (t.tutar||0), 0);
    const kalan = Math.max(0, gelir - toplamTahsil);
    return { toplamTahsil, kalan, tamamlandiMi: kalan < 0.01 };
  }
  if (h.odendi) return { toplamTahsil: gelir, kalan: 0, tamamlandiMi: true };
  return { toplamTahsil: 0, kalan: gelir, tamamlandiMi: false };
}

function tahsilatModal(hId) {
  const h = data.hareketler.find(x => x.__id === hId);
  if (!h) return;
  window.__tahsilatHedefId = hId;
  const overlay = document.createElement("div");
  overlay.id = "tahsilat-modal";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(6,5,14,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";
  overlay.innerHTML = tahsilatModalIcerik(h);
  document.body.appendChild(overlay);
}

function tahsilatModalIcerik(h) {
  const durum = tahsilatDurumu(h);
  const cariAnahtar = normMusteri(h.aciklama);
  const mevcutKredi = data.cariBakiyeler[cariAnahtar] || 0;
  let html = '<div style="background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;max-height:88vh;overflow:auto">';
  html += '<div class="mtitle">💰 Tahsilat — '+esc(h.aciklama)+'</div>';
  html += '<div class="hesap-satir"><span>Toplam Tutar</span><b>'+fmt(h.gelir)+'</b></div>';
  html += '<div class="hesap-satir"><span>Tahsil Edilen</span><b class="yesil">'+fmt(durum.toplamTahsil)+'</b></div>';
  html += '<div class="hesap-satir"><span>Kalan</span><b class="'+(durum.kalan>0.01?"kirmizi":"yesil")+'">'+fmt(durum.kalan)+'</b></div>';
  if (mevcutKredi > 0.01 && durum.kalan > 0.01) {
    html += '<div class="mini" style="color:var(--green);margin-top:6px">Bu müşterinin +'+fmt(mevcutKredi)+' cari bakiyesi var. <span class="adet-edit" onclick="cariUygulaTekil()">Buraya uygula</span></div>';
  }
  if (h.tahsilatlar && h.tahsilatlar.length) {
    html += '<div class="mini" style="font-weight:800;margin:12px 0 6px">Tahsilat Geçmişi</div>';
    h.tahsilatlar.forEach((t,i) => {
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #262837;font-size:13px">'
        + '<span>'+fmtTarih(t.tarih)+'</span><span class="yesil" style="font-weight:700">'+fmt(t.tutar)+'</span>'
        + '<button class="sil-x" onclick="tahsilatSil('+i+')">×</button></div>';
    });
  }
  if (durum.kalan > 0.01) {
    html += '<div style="margin-top:14px"><div class="mini" style="margin-bottom:5px">Yeni Tahsilat Tutarı (kısmi girebilirsin)</div>'
      + '<input type="text" id="tahsilat-tutar" inputmode="decimal" value="'+String(durum.kalan.toFixed(2)).replace(".",",")+'"></div>';
    html += '<button class="btn" style="background:var(--green);margin-top:10px" onclick="tahsilatEkle()">✓ Tahsilatı Kaydet</button>';
  } else {
    html += '<div class="mini" style="margin-top:10px;color:var(--green);font-weight:700">✓ Tamamı tahsil edildi</div>';
  }
  html += '<button class="btn" style="background:#2A2C3A;margin-top:8px" onclick="tahsilatModalKapat()">Kapat</button>';
  html += '</div>';
  return html;
}

function tahsilatEkle() {
  const h = data.hareketler.find(x => x.__id === window.__tahsilatHedefId);
  if (!h) return;
  const el = document.getElementById("tahsilat-tutar");
  const n = parseTL(el ? el.value : "");
  if (isNaN(n) || n <= 0) { toast("Geçerli bir tutar girin"); return; }
  const durum = tahsilatDurumu(h);
  if (n > durum.kalan + 0.01) {
    if (!confirm("Girilen tutar ("+fmt(n)+") kalan bakiyeden ("+fmt(durum.kalan)+") fazla. Yine de kaydedilsin mi?")) return;
  }
  if (!h.tahsilatlar) h.tahsilatlar = [];
  h.tahsilatlar.push({ tarih: yerelTarihStr(), tutar: n });
  h.odendi = tahsilatDurumu(h).tamamlandiMi;
  save();
  const modalEl = document.getElementById("tahsilat-modal");
  if (modalEl) modalEl.innerHTML = tahsilatModalIcerik(h);
  render();
  toast("✓ Tahsilat kaydedildi");
}

// Müşterinin mevcut cari bakiyesini (fazla ödemesini) açık olan tekil faturaya uygular
function cariUygulaTekil() {
  const h = data.hareketler.find(x => x.__id === window.__tahsilatHedefId);
  if (!h) return;
  const anahtar = normMusteri(h.aciklama);
  const kredi = data.cariBakiyeler[anahtar] || 0;
  if (kredi <= 0.01) { toast("Cari bakiye kalmadı"); return; }
  const durum = tahsilatDurumu(h);
  const uygulanan = Math.min(kredi, durum.kalan);
  if (uygulanan <= 0.01) { toast("Bu faturada zaten kalan bakiye yok"); return; }
  if (!h.tahsilatlar) h.tahsilatlar = [];
  h.tahsilatlar.push({ tarih: yerelTarihStr(), tutar: uygulanan });
  data.cariBakiyeler[anahtar] = kredi - uygulanan;
  if (data.cariBakiyeler[anahtar] < 0.01) delete data.cariBakiyeler[anahtar];
  h.odendi = tahsilatDurumu(h).tamamlandiMi;
  save();
  const modalEl = document.getElementById("tahsilat-modal");
  if (modalEl) modalEl.innerHTML = tahsilatModalIcerik(h);
  render();
  toast("✓ "+fmt(uygulanan)+" cari bakiyeden uygulandı");
}

function tahsilatSil(i) {
  const h = data.hareketler.find(x => x.__id === window.__tahsilatHedefId);
  if (!h || !h.tahsilatlar) return;
  if (!confirm("Bu tahsilat kaydı silinsin mi?")) return;
  h.tahsilatlar.splice(i,1);
  h.odendi = tahsilatDurumu(h).tamamlandiMi;
  save();
  const modalEl = document.getElementById("tahsilat-modal");
  if (modalEl) modalEl.innerHTML = tahsilatModalIcerik(h);
  render();
  toast("Tahsilat kaydı silindi");
}

function tahsilatModalKapat() {
  const el = document.getElementById("tahsilat-modal");
  if (el) el.remove();
  window.__tahsilatHedefId = null;
}

// ============ MÜŞTERİ BAZLI TOPLU TAHSİLAT ============
// Bir müşteriden tek seferde alınan toplu bir ödemeyi, o müşterinin birden fazla açık
// faturasına otomatik dağıtır (en eski fatura önce kapanır — standart yaşlandırma mantığı).
function musteriBekleyenFaturalar(musteriAdi) {
  const normalized = normMusteri(musteriAdi);
  return data.hareketler
    .filter(h => h.tur === "GELİR" && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış") && normMusteri(h.aciklama) === normalized)
    .map(h => ({ h, durum: tahsilatDurumu(h) }))
    .filter(x => x.durum.kalan > 0.01)
    .sort((a,b) => a.h.tarih.localeCompare(b.h.tarih));
}

function musteriBekleyenToplam(musteriAdi) {
  return musteriBekleyenFaturalar(musteriAdi).reduce((s,x) => s + x.durum.kalan, 0);
}

function musteriTahsilatDagitimHesapla(musteriAdi, tutar) {
  const faturalar = musteriBekleyenFaturalar(musteriAdi);
  let kalanTutar = tutar;
  const dagitim = [];
  for (const x of faturalar) {
    if (kalanTutar <= 0.01) break;
    const uygulanan = Math.min(kalanTutar, x.durum.kalan);
    dagitim.push({ h: x.h, uygulanan, kalanSonra: x.durum.kalan - uygulanan });
    kalanTutar -= uygulanan;
  }
  return { dagitim, kullanilmayanTutar: Math.max(0, kalanTutar) };
}

function musteriTahsilatModal(musteriAdi) {
  window.__musteriTahsilatHedef = musteriAdi;
  const overlay = document.createElement("div");
  overlay.id = "musteri-tahsilat-modal";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(6,5,14,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto";
  overlay.innerHTML = musteriTahsilatIcerik();
  document.body.appendChild(overlay);
}

function musteriTahsilatIcerik() {
  const musteriAdi = window.__musteriTahsilatHedef;
  const faturalar = musteriBekleyenFaturalar(musteriAdi);
  const toplamBekleyen = faturalar.reduce((s,x) => s + x.durum.kalan, 0);
  const mevcutKredi = data.cariBakiyeler[normMusteri(musteriAdi)] || 0;
  let html = '<div style="background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:440px;max-height:88vh;overflow:auto">';
  html += '<div class="mtitle">💰 '+esc(musteriAdi)+' — Toplu Tahsilat</div>';
  html += '<div class="hesap-satir"><span>Toplam Bekleyen ('+faturalar.length+' fatura)</span><b class="kirmizi">'+fmt(toplamBekleyen)+'</b></div>';
  if (mevcutKredi > 0.01) html += '<div class="hesap-satir"><span>Mevcut Cari Bakiye (fazla ödeme)</span><b class="yesil">+'+fmt(mevcutKredi)+'</b></div>';
  if (faturalar.length) {
    html += '<div class="mini" style="font-weight:800;margin:10px 0 6px">Bekleyen Faturalar (eskiden yeniye — dağıtım bu sırayla yapılır)</div>';
    faturalar.forEach(x => {
      html += '<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #262837;font-size:12.5px">'
        + '<span>'+fmtTarih(x.h.tarih)+' · '+esc(x.h.kategori)+(x.durum.toplamTahsil>0.01?' <span class="mini">(kısmi ödenmiş)</span>':'')+'</span>'
        + '<span class="kirmizi" style="font-weight:700">'+fmt(x.durum.kalan)+'</span></div>';
    });
  } else {
    html += '<div class="mini" style="margin-top:6px">Bu müşteride bekleyen fatura yok'+(mevcutKredi>0.01?" — girdiğin tutar tamamen cari bakiyeye eklenecek.":".")+'</div>';
  }
  html += '<div style="margin-top:14px"><div class="mini" style="margin-bottom:5px">Alınan Toplu Ödeme Tutarı</div>'
    + '<input type="text" id="musteri-tahsilat-tutar" inputmode="decimal" placeholder="ör. 40000" oninput="musteriTahsilatOnizle()"></div>';
  html += '<div id="musteri-tahsilat-onizleme"></div>';
  html += '<button class="btn" style="background:var(--green);margin-top:10px" onclick="musteriTahsilatUygula()">✓ Dağıt ve Kaydet</button>';
  html += '<button class="btn" style="background:#2A2C3A;margin-top:8px" onclick="musteriTahsilatModalKapat()">Kapat</button>';
  html += '</div>';
  return html;
}

function musteriTahsilatOnizle() {
  const el = document.getElementById("musteri-tahsilat-tutar");
  const onizEl = document.getElementById("musteri-tahsilat-onizleme");
  if (!el || !onizEl) return;
  const n = parseTL(el.value);
  if (isNaN(n) || n <= 0) { onizEl.innerHTML = ""; return; }
  const { dagitim, kullanilmayanTutar } = musteriTahsilatDagitimHesapla(window.__musteriTahsilatHedef, n);
  let html = '<div class="mini" style="font-weight:800;margin:10px 0 6px">Dağıtım Önizlemesi</div>';
  dagitim.forEach(d => {
    html += '<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px">'
      + '<span>'+fmtTarih(d.h.tarih)+' · '+esc(d.h.kategori)+'</span>'
      + '<span class="yesil" style="font-weight:700">-'+fmt(d.uygulanan)+'</span>'
      + '<span class="mini">'+(d.kalanSonra<0.01?"✓ kapanıyor":"kalan "+fmt(d.kalanSonra))+'</span></div>';
  });
  if (kullanilmayanTutar > 0.01) {
    html += '<div class="mini" style="color:var(--green);margin-top:6px;font-weight:700">+ '+fmt(kullanilmayanTutar)+' cari bakiyeye eklenecek — bir sonraki faturasından otomatik düşülecek.</div>';
  }
  onizEl.innerHTML = html;
}

function musteriTahsilatUygula() {
  const el = document.getElementById("musteri-tahsilat-tutar");
  const n = parseTL(el ? el.value : "");
  if (isNaN(n) || n <= 0) { toast("Geçerli bir tutar girin"); return; }
  const musteriAdi = window.__musteriTahsilatHedef;
  const { dagitim, kullanilmayanTutar } = musteriTahsilatDagitimHesapla(musteriAdi, n);
  const bugun = yerelTarihStr();
  dagitim.forEach(d => {
    if (!d.h.tahsilatlar) d.h.tahsilatlar = [];
    d.h.tahsilatlar.push({ tarih: bugun, tutar: d.uygulanan });
    d.h.odendi = tahsilatDurumu(d.h).tamamlandiMi;
  });
  let mesaj = "✓ Tahsilat "+dagitim.length+" faturaya dağıtıldı";
  if (kullanilmayanTutar > 0.01) {
    const anahtar = normMusteri(musteriAdi);
    data.cariBakiyeler[anahtar] = (data.cariBakiyeler[anahtar]||0) + kullanilmayanTutar;
    mesaj += " · +"+fmt(kullanilmayanTutar)+" cari bakiyeye eklendi";
  }
  save();
  musteriTahsilatModalKapat();
  render();
  toast(mesaj);
}

function musteriTahsilatModalKapat() {
  const el = document.getElementById("musteri-tahsilat-modal");
  if (el) el.remove();
  window.__musteriTahsilatHedef = null;
}

// Hareketler tablosunda tahsilat sütununu (durum + tıklanabilir) üretir
function tahsilDurumHucre(h) {
  const tahsilVar = (h.tur === "GELİR" && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış" || h.vade));
  if (!tahsilVar) return "";
  const durum = tahsilatDurumu(h);
  if (durum.tamamlandiMi) {
    return '<span class="yesil" style="font-weight:700;cursor:pointer;font-size:12px;white-space:nowrap" onclick="tahsilatModal(\''+h.__id+'\')">✓ Tahsil</span>';
  }
  if (durum.toplamTahsil > 0.01) {
    return '<span style="cursor:pointer;font-size:11px;color:var(--amber);font-weight:700;white-space:nowrap" onclick="tahsilatModal(\''+h.__id+'\')">Kalan '+fmtK(durum.kalan)+'</span>';
  }
  return '<span style="cursor:pointer;font-size:12px;color:var(--red);font-weight:700;white-space:nowrap" onclick="tahsilatModal(\''+h.__id+'\')">Bekliyor</span>';
}

function tumunuTahsilYap() {
  if (!confirm("Filtredeki bekleyen tüm satış tahsilatları (kalan bakiyeleri) tamamen tahsil edildi olarak işaretlensin mi?")) return;
  let n = 0;
  const bugun = yerelTarihStr();
  data.hareketler.forEach(h => {
    if (h.tur === "GELİR" && h.kategori !== "Sermaye" && h.kategori !== "Kredi Kullanımı" && (h.kategori === "Satış-Fatura" || h.kategori === "Perakende Satış" || h.vade)) {
      const durum = tahsilatDurumu(h);
      if (!durum.tamamlandiMi) {
        if (!h.tahsilatlar) h.tahsilatlar = [];
        if (durum.kalan > 0.01) h.tahsilatlar.push({ tarih: bugun, tutar: durum.kalan });
        h.odendi = true;
        n++;
      }
    }
  });
  save(); render();
  toast("✓ "+n+" kayıt tamamen tahsil edildi");
}

function silOnay(idx) {
  const h = data.hareketler[idx];
  if (!h) return;
  if (!confirm('"'+h.aciklama+'" ('+fmtTarih(h.tarih)+' — '+fmt(h.gelir||h.gider)+') silinsin mi?')) return;
  // Satışta stoktan düşülmüş kalemler varsa geri ekleme seçeneği
  if (h.kalemler && h.kalemler.length) {
    if (confirm("Bu satışta stoktan düşülen ürünler var:\n" + h.kalemler.map(k => "• " + k.ad + " × " + k.adet).join("\n") + "\n\nStoğa geri eklensin mi?")) {
      h.kalemler.forEach(k => {
        const m = data.mamul.find(m => m.kalite+"|"+m.tip+"|"+m.genislik+"|"+m.gramaj === k.key);
        if (m) m.adet += k.adet;
      });
    }
  }
  // Bu satışa daha önce tahsilat girilmişse (kısmi/tam), o para zaten müşteriden alınmıştı —
  // fatura silinince kaybolmasın diye müşterinin cari bakiyesine geri eklenebilir.
  const toplamTahsil = (h.tahsilatlar||[]).reduce((s,t) => s + (t.tutar||0), 0);
  if (toplamTahsil > 0.01) {
    if (confirm("Bu satışta "+fmt(toplamTahsil)+" tahsilat kaydı var. Bu tutar müşterinin cari bakiyesine geri eklensin mi? (Evet demezsen bu tahsilat kaybolur)")) {
      const anahtar = normMusteri(h.aciklama);
      data.cariBakiyeler[anahtar] = (data.cariBakiyeler[anahtar]||0) + toplamTahsil;
    }
  }
  data.hareketler.splice(idx, 1);
  save(); render();
  toast("Silindi");
}

// ============ GERÇEK XLSX MOTORU (harici kütüphane yok, saf JS) ============
// ZIP yazıcı (store/sıkıştırmasız yöntem — Excel bu yöntemi tam destekler)
const XLSX_CRC_TABLE = (() => {
  let tablo = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tablo[n] = c >>> 0;
  }
  return tablo;
})();
function xlsxCrc32(bytes) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) crc = XLSX_CRC_TABLE[(crc ^ bytes[i]) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function xlsxDosZaman(d) {
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | Math.floor(d.getSeconds() / 2);
  const tarih = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  return { time, tarih };
}
function xlsxZipYaz(dosyalar) {
  const enc = new TextEncoder();
  const parcalar = [];
  const merkezi = [];
  let ofset = 0;
  const { time, tarih } = xlsxDosZaman(new Date());
  dosyalar.forEach(({ ad, icerik }) => {
    const veri = enc.encode(icerik);
    const adBytes = enc.encode(ad);
    const crc = xlsxCrc32(veri);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0, true);
    lh.setUint16(8, 0, true); lh.setUint16(10, time, true); lh.setUint16(12, tarih, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, veri.length, true); lh.setUint32(22, veri.length, true);
    lh.setUint16(26, adBytes.length, true); lh.setUint16(28, 0, true);
    const lokalTam = new Uint8Array(30 + adBytes.length);
    lokalTam.set(new Uint8Array(lh.buffer), 0); lokalTam.set(adBytes, 30);
    parcalar.push(lokalTam, veri);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0, true); ch.setUint16(10, 0, true); ch.setUint16(12, time, true); ch.setUint16(14, tarih, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, veri.length, true); ch.setUint32(24, veri.length, true);
    ch.setUint16(28, adBytes.length, true); ch.setUint16(30, 0, true); ch.setUint16(32, 0, true);
    ch.setUint16(34, 0, true); ch.setUint16(36, 0, true); ch.setUint32(38, 0, true); ch.setUint32(42, ofset, true);
    const merkeziTam = new Uint8Array(46 + adBytes.length);
    merkeziTam.set(new Uint8Array(ch.buffer), 0); merkeziTam.set(adBytes, 46);
    merkezi.push(merkeziTam);

    ofset += lokalTam.length + veri.length;
  });
  const merkeziBoyut = merkezi.reduce((s, b) => s + b.length, 0);
  const eocd = new DataView(new ArrayBuffer(22));
  eocd.setUint32(0, 0x06054b50, true); eocd.setUint16(8, dosyalar.length, true); eocd.setUint16(10, dosyalar.length, true);
  eocd.setUint32(12, merkeziBoyut, true); eocd.setUint32(16, ofset, true);
  const tumParcalar = [...parcalar, ...merkezi, new Uint8Array(eocd.buffer)];
  const toplamBoyut = tumParcalar.reduce((s, p) => s + p.length, 0);
  const sonuc = new Uint8Array(toplamBoyut);
  let pos = 0;
  tumParcalar.forEach(p => { sonuc.set(p, pos); pos += p.length; });
  return sonuc;
}

// OOXML (xlsx) sayfa/hücre yardımcıları
function xlsxSutunHarfi(i) {
  i++; let s = '';
  while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); }
  return s;
}
function xlsxEsc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
const XLSX_EPOCH = Date.UTC(1899, 11, 30);
function xlsxTarihSerial(iso) {
  const p = iso.split("-").map(Number);
  return Math.round((Date.UTC(p[0], p[1]-1, p[2]) - XLSX_EPOCH) / 86400000);
}
// Hücre kısayolları: M=sayı, T=metin, D=tarih
function xM(v, s) { return { v: Number(v)||0, s }; }
function xT(v, s) { return { v: (v==null?"":String(v)), t:"s", s }; }
function xD(iso, s) { return { v: xlsxTarihSerial(iso), s }; }
function xlsxSatir(rowIndex, hucreler, yukseklik) {
  let xml = "";
  hucreler.forEach((h, ci) => {
    if (h == null) return;
    const ref = xlsxSutunHarfi(ci) + rowIndex;
    if (h.t === "s") xml += '<c r="'+ref+'" s="'+(h.s||0)+'" t="inlineStr"><is><t xml:space="preserve">'+xlsxEsc(h.v)+'</t></is></c>';
    else xml += '<c r="'+ref+'" s="'+(h.s||0)+'"><v>'+h.v+'</v></c>';
  });
  const ht = yukseklik ? ' ht="'+yukseklik+'" customHeight="1"' : '';
  return '<row r="'+rowIndex+'"'+ht+'>'+xml+'</row>';
}
function xlsxSayfaXml(opts) {
  const { satirlar, kolonGenislikleri, donmusSatir, filtreAraligi, birlesmeler, sonSutun, sonSatir } = opts;
  let s = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">';
  s += '<dimension ref="A1:'+xlsxSutunHarfi(sonSutun-1)+sonSatir+'"/>';
  s += '<sheetViews><sheetView workbookViewId="0"';
  if (!donmusSatir) { s += '/></sheetViews>'; }
  else {
    s += '><pane ySplit="'+donmusSatir+'" topLeftCell="A'+(donmusSatir+1)+'" activePane="bottomLeft" state="frozen"/>'
      + '<selection pane="bottomLeft" activeCell="A'+(donmusSatir+1)+'" sqref="A'+(donmusSatir+1)+'"/></sheetView></sheetViews>';
  }
  s += '<sheetFormatPr defaultRowHeight="16"/>';
  if (kolonGenislikleri && kolonGenislikleri.length) {
    s += '<cols>' + kolonGenislikleri.map((w,i) => '<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('') + '</cols>';
  }
  s += '<sheetData>' + satirlar.join('') + '</sheetData>';
  if (filtreAraligi) s += '<autoFilter ref="'+filtreAraligi+'"/>';
  if (birlesmeler && birlesmeler.length) s += '<mergeCells count="'+birlesmeler.length+'">' + birlesmeler.map(r => '<mergeCell ref="'+r+'"/>').join('') + '</mergeCells>';
  s += '</worksheet>';
  return s;
}

function xlsxOlustur(sayfalar) {
  const dosyalar = [
    { ad: "[Content_Types].xml", icerik:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
      + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
      + '<Default Extension="xml" ContentType="application/xml"/>'
      + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
      + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
      + sayfalar.map((_,i) => '<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')
      + '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'
      + '<Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/>'
      + '</Types>' },
    { ad: "_rels/.rels", icerik:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
      + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'
      + '<Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/>'
      + '</Relationships>' },
    { ad: "xl/_rels/workbook.xml.rels", icerik:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
      + sayfalar.map((_,i) => '<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')
      + '<Relationship Id="rId'+(sayfalar.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
      + '</Relationships>' },
    { ad: "xl/workbook.xml", icerik:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
      + '<sheets>' + sayfalar.map((s,i) => '<sheet name="'+xlsxEsc(s.ad)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('') + '</sheets></workbook>' },
    { ad: "xl/styles.xml", icerik: XLSX_STYLES },
    { ad: "docProps/core.xml", icerik:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>RAZ Plastik Mali Rapor</dc:title><dc:creator>RAZ Plastik Poliwood</dc:creator></cp:coreProperties>' },
    { ad: "docProps/app.xml", icerik:
      '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>RAZ Panel</Application></Properties>' }
  ];
  sayfalar.forEach((s,i) => dosyalar.push({ ad: "xl/worksheets/sheet"+(i+1)+".xml", icerik: s.xml }));
  return xlsxZipYaz(dosyalar);
}

function xlsxBaslikSatiri(rowIndex, metin, sutunSayisi, stil, yukseklik) {
  const hucreler = [xT(metin, stil)];
  for (let i = 1; i < sutunSayisi; i++) hucreler.push(xT("", stil));
  return { xml: xlsxSatir(rowIndex, hucreler, yukseklik||24), merge: "A"+rowIndex+":"+xlsxSutunHarfi(sutunSayisi-1)+rowIndex };
}

function disaAktar() {
  const H = hesapla();
  const bugunIso = yerelTarihStr();
  const gelirler = H.satirlar.filter(x => x.gelir);
  const giderler = H.satirlar.filter(x => x.gider);
  const topGelir = gelirler.reduce((s,x) => s + x.gelir, 0);
  const topGider = giderler.reduce((s,x) => s + x.gider, 0);

  // ---- SAYFA 1: ÖZET ----
  const ozetSatirlar = [];
  const ozetMerge = [];
  let r = 1;
  let bb = xlsxBaslikSatiri(r, "RAZ PLASTİK — POLİWOOD · MALİ ÖZET", 5, XS.baslikNavy, 30); ozetSatirlar.push(bb.xml); ozetMerge.push(bb.merge); r++;
  bb = xlsxBaslikSatiri(r, "Rapor tarihi: " + fmtTarih(bugunIso), 5, XS.altbilgi, 20); ozetSatirlar.push(bb.xml); ozetMerge.push(bb.merge); r++;
  r++; // boş satır
  ozetSatirlar.push(xlsxSatir(r, [xT("TOPLAM GELİR", XS.etiket), xM(topGelir, XS.paraYesil)])); r++;
  ozetSatirlar.push(xlsxSatir(r, [xT("TOPLAM GİDER", XS.etiket), xM(topGider, XS.paraKirmizi)])); r++;
  ozetSatirlar.push(xlsxSatir(r, [xT("KASA (NET)", XS.etiket), xM(H.bakiye, H.bakiye>=0?XS.paraYesil:XS.paraKirmizi)])); r++;
  r++; // boş satır
  const ozetHeaderRow = r;
  ozetSatirlar.push(xlsxSatir(r, [xT("Ay",XS.tabloBaslik), xT("Satış",XS.tabloBaslik), xT("Diğer Gelir",XS.tabloBaslik), xT("Gider",XS.tabloBaslik), xT("Net",XS.tabloBaslik)])); r++;
  const aylikKeys = Object.keys(H.aylik).sort();
  aylikKeys.forEach(k => {
    const a = H.aylik[k]; const net = a.satis + a.diger - a.gider; const p = k.split("-");
    ozetSatirlar.push(xlsxSatir(r, [
      xT(AYLAR[parseInt(p[1])-1] + " " + p[0], XS.metinBorder),
      xM(a.satis, XS.paraYesil), xM(a.diger, XS.para), xM(a.gider, XS.paraKirmizi),
      xM(net, net>=0?XS.paraYesil:XS.paraKirmizi)
    ])); r++;
  });
  const ozetXml = xlsxSayfaXml({ satirlar: ozetSatirlar, kolonGenislikleri: [22,16,16,16,16], donmusSatir: ozetHeaderRow, birlesmeler: ozetMerge, sonSutun: 5, sonSatir: r-1 });

  // ---- SAYFA 2: GELİRLER ----
  const gelirSatirlar = []; const gelirMerge = [];
  r = 1;
  bb = xlsxBaslikSatiri(r, "GELİRLER", 9, XS.baslikYesil); gelirSatirlar.push(bb.xml); gelirMerge.push(bb.merge); r++;
  const gelirHeaderRow = r;
  gelirSatirlar.push(xlsxSatir(r, [xT("Tarih",XS.tabloBaslik),xT("Açıklama",XS.tabloBaslik),xT("Kategori",XS.tabloBaslik),xT("Tutar",XS.tabloBaslik),xT("Kg",XS.tabloBaslik),xT("Tahsil",XS.tabloBaslik),xT("Kalan",XS.tabloBaslik),xT("Vade",XS.tabloBaslik),xT("Not",XS.tabloBaslik)])); r++;
  let topGelirKg = 0, topKalan = 0;
  gelirler.forEach(x => {
    const tahsilVar = (x.kategori === "Satış-Fatura" || x.kategori === "Perakende Satış" || x.vade);
    const durum = tahsilatDurumu(x);
    let tahsilMetin = "";
    if (tahsilVar) tahsilMetin = durum.tamamlandiMi ? "Evet" : (durum.toplamTahsil > 0.01 ? "Kısmi" : "Hayır");
    gelirSatirlar.push(xlsxSatir(r, [
      xD(x.tarih, XS.tarih), xT(x.aciklama, XS.metinBorder), xT(x.kategori, XS.metinBorder),
      xM(x.gelir, XS.paraYesil), xM(x.kg||0, XS.kg),
      xT(tahsilMetin, XS.ortaBorder),
      tahsilVar && !durum.tamamlandiMi ? xM(durum.kalan, XS.paraKirmizi) : xT("", XS.ortaBorder),
      x.vade ? xD(x.vade, XS.tarih) : xT("", XS.ortaBorder),
      xT(x.not||"", XS.metinBorder)
    ]));
    topGelirKg += (x.kg||0);
    if (tahsilVar) topKalan += durum.kalan;
    r++;
  });
  const gelirLastData = r-1;
  gelirSatirlar.push(xlsxSatir(r, [xT("TOPLAM ("+gelirler.length+" kayıt)",XS.toplamEtiket),xT("",XS.toplamEtiket),xT("",XS.toplamEtiket),xM(topGelir,XS.toplamParaYesil),xM(topGelirKg,XS.toplamKg),xT("",XS.toplamEtiket),xM(topKalan,XS.toplamParaKirmizi),xT("",XS.toplamEtiket),xT("",XS.toplamEtiket)]));
  gelirMerge.push("A"+r+":C"+r);
  const gelirXml = xlsxSayfaXml({ satirlar: gelirSatirlar, kolonGenislikleri: [12,26,16,14,11,10,12,12,26], donmusSatir: gelirHeaderRow, filtreAraligi: "A"+gelirHeaderRow+":I"+gelirLastData, birlesmeler: gelirMerge, sonSutun: 9, sonSatir: r });

  // ---- SAYFA 3: GİDERLER ----
  const giderSatirlar = []; const giderMerge = [];
  r = 1;
  bb = xlsxBaslikSatiri(r, "GİDERLER", 5, XS.baslikKirmizi); giderSatirlar.push(bb.xml); giderMerge.push(bb.merge); r++;
  const giderHeaderRow = r;
  giderSatirlar.push(xlsxSatir(r, [xT("Tarih",XS.tabloBaslik),xT("Açıklama",XS.tabloBaslik),xT("Kategori",XS.tabloBaslik),xT("Tutar",XS.tabloBaslik),xT("Not",XS.tabloBaslik)])); r++;
  giderler.forEach(x => {
    giderSatirlar.push(xlsxSatir(r, [xD(x.tarih,XS.tarih), xT(x.aciklama,XS.metinBorder), xT(x.kategori,XS.metinBorder), xM(x.gider,XS.paraKirmizi), xT(x.not||"",XS.metinBorder)]));
    r++;
  });
  const giderLastData = r-1;
  giderSatirlar.push(xlsxSatir(r, [xT("TOPLAM ("+giderler.length+" kayıt)",XS.toplamEtiket),xT("",XS.toplamEtiket),xT("",XS.toplamEtiket),xM(topGider,XS.toplamParaKirmizi),xT("",XS.toplamEtiket)]));
  giderMerge.push("A"+r+":C"+r);
  const giderXml = xlsxSayfaXml({ satirlar: giderSatirlar, kolonGenislikleri: [12,32,20,14,30], donmusSatir: giderHeaderRow, filtreAraligi: "A"+giderHeaderRow+":E"+giderLastData, birlesmeler: giderMerge, sonSutun: 5, sonSatir: r });

  // ---- SAYFA 4: STOK ----
  const stokSatirlar = []; const stokMerge = [];
  r = 1;
  bb = xlsxBaslikSatiri(r, "STOK DURUMU VE DEĞERİ", 5, XS.baslikNavy); stokSatirlar.push(bb.xml); stokMerge.push(bb.merge); r++;
  bb = xlsxBaslikSatiri(r, "Rapor tarihi: " + fmtTarih(bugunIso), 5, XS.altbilgi, 20); stokSatirlar.push(bb.xml); stokMerge.push(bb.merge); r++;
  r++;
  bb = xlsxBaslikSatiri(r, "MAMUL STOK", 5, XS.baslikYesil); stokSatirlar.push(bb.xml); stokMerge.push(bb.merge); r++;
  stokSatirlar.push(xlsxSatir(r, [xT("Ürün",XS.tabloBaslik),xT("Adet",XS.tabloBaslik),xT("Kg/Bobin",XS.tabloBaslik),xT("Toplam Kg",XS.tabloBaslik),xT("Değer (KDV dahil)",XS.tabloBaslik)])); r++;
  let mamulTopKg = 0, mamulTopDeger = 0;
  data.mamul.forEach(m => {
    const kg = (m.adet||0) * (m.kgBobin||0);
    const deger = kg * fiyatBul(m.kalite) * 1.2;
    mamulTopKg += kg; mamulTopDeger += deger;
    stokSatirlar.push(xlsxSatir(r, [
      xT(m.kalite+" "+m.tip+" "+m.genislik+(m.gramaj!=="-"?" "+m.gramaj:""), XS.metinBorder),
      xM(m.adet, XS.adetBorder), xM(m.kgBobin, XS.kg), xM(kg, XS.kg), xM(deger, XS.para)
    ])); r++;
  });
  stokSatirlar.push(xlsxSatir(r, [xT("TOPLAM",XS.toplamEtiket),xT("",XS.toplamEtiket),xT("",XS.toplamEtiket),xM(mamulTopKg,XS.toplamKg),xM(mamulTopDeger,XS.toplamPara)]));
  r++;
  r++;
  bb = xlsxBaslikSatiri(r, "HAMMADDE STOK", 4, XS.baslikKirmizi); stokSatirlar.push(bb.xml); stokMerge.push(bb.merge); r++;
  stokSatirlar.push(xlsxSatir(r, [xT("Tedarikçi",XS.tabloBaslik),xT("Kalan Kg",XS.tabloBaslik),xT("₺/kg",XS.tabloBaslik),xT("Değer (KDV dahil)",XS.tabloBaslik)])); r++;
  let hamTopKg = 0, hamTopDeger = 0;
  data.hammadde.forEach(h => {

    ])); r++;
  });
  stokSatirlar.push(xlsxSatir(r, [xT("TOPLAM",XS.toplamEtiket),xM(hamTopKg,XS.toplamKg),xT("",XS.toplamEtiket),xM(hamTopDeger,XS.toplamPara)]));

  const katGirdiler = Object.entries(H.katGider).sort((a,b) => b[1]-a[1]);

}

function aylikRaporSec() {
  const simdi = new Date();
  const buAy = buAyKey();
  const gecenAy = gecenAyKey();
  const buAyAdi = AYLAR[simdi.getMonth()] + " " + simdi.getFullYear();
  const gecenTarih = new Date(simdi.getFullYear(), simdi.getMonth()-1, 1);
  const gecenAyAdi = AYLAR[gecenTarih.getMonth()] + " " + gecenTarih.getFullYear();

  const overlay = document.createElement("div");
  overlay.id = "aylik-rapor-modal";
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(6,5,14,.75);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px";
  overlay.innerHTML =
    '<div style="background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:380px">'
    + '<div class="mtitle">Hangi ayın raporu?</div>'
    + '<div class="mini" style="margin-bottom:14px">Ayın başında basarsan yeni ay neredeyse boş çıkar — doğru ayı seç.</div>'
    + '<div style="display:flex;flex-direction:column;gap:8px">'
    + '<button class="btn" style="background:var(--blue)" onclick="aylikRaporModalKapat();aylikRaporIndir(\''+buAy+'\')">📅 '+buAyAdi+' (bu ay)</button>'
    + '<button class="btn" style="background:var(--navy2)" onclick="aylikRaporModalKapat();aylikRaporIndir(\''+gecenAy+'\')">📅 '+gecenAyAdi+' (geçen ay)</button>'
    + '<button class="btn" style="background:#2A2C3A" onclick="aylikRaporModalKapat()">İptal</button>'
    + '</div></div>';
  document.body.appendChild(overlay);
}
function aylikRaporModalKapat() {
  const el = document.getElementById("aylik-rapor-modal");

}

function aylikRaporIndir(secilenAyKey) {
  const ayKey = secilenAyKey || buAyKey();
  const H = hesapla();
  const bugunIso = yerelTarihStr();
  const p = ayKey.split("-");
  const ayAdi = AYLAR[parseInt(p[1])-1] + " " + p[0];

function sifirlaOnay() {
  if (!confirm("DİKKAT: Tüm kayıtlar başlangıç (seed) verisine sıfırlanacak. Bulut verisi de üzerine yazılır. Emin misin?")) return;
  if (!confirm("Son onay — bu işlem geri alınamaz. Sıfırlansın mı?")) return;
  data = saglaId(JSON.parse(JSON.stringify(SEED)));
  save(); resetForm(); render();
  toast("Veriler sıfırlandı");
}

// ============ STOK ============
function rStok() {
  // Toplam stok değerini önceden hesapla (KPI özet için)
  let mamulDeger = 0;
  data.mamul.forEach(m => { mamulDeger += (m.adet||0) * (m.kgBobin||0) * fiyatBul(m.kalite) * 1.2; });
  let hamDeger = 0;
  data.hammadde.forEach(h => { hamDeger += (h.kalan||0) * hamFiyatBul(h) * 1.2; });

  let html = '<div class="kpi-grid">'
    + '<div class="kpi"><div class="lbl">Mamul Stok Değeri</div><div class="v yesil">'+fmtK(mamulDeger)+'</div><span class="mini">KDV dahil, liste fiyatıyla</span></div>'
    + '<div class="kpi"><div class="lbl">Hammadde Stok Değeri</div><div class="v">'+fmtK(hamDeger)+'</div><span class="mini">KDV dahil, tanımlı fiyatla</span></div>'
    + '<div class="kpi"><div class="lbl">Toplam Stok Değeri</div><div class="v" style="color:var(--amber)">'+fmtK(mamulDeger+hamDeger)+'</div></div>'
    + '</div>';
  html += '<div class="card"><button class="chip" style="color:var(--blue);border-color:var(--blue)" onclick="sayimKarsilastirModal()">📋 Stok Sayım Karşılaştır</button><div class="mini" style="margin-top:6px">Muhasebe/depo ay sonunda sayım verdiğinde, panelin izlediği rakamla karşılaştır.</div></div>';

  html += '<div class="card"><div class="mtitle">Mamul Stok <span class="pill">bobin</span></div><div class="scroll"><table><tr><th>Ürün</th><th class="num">Adet</th><th class="num">Kg/Bobin</th><th class="num">Toplam Kg</th><th class="num">Değer</th><th></th></tr>';
  let topKg = 0;
  data.mamul.forEach((m,i) => {
    const kg = (m.adet||0) * (m.kgBobin||0);
    topKg += kg;
    const deger = kg * fiyatBul(m.kalite) * 1.2;
    const renk = m.adet <= 0 ? "kirmizi" : (m.adet < STOK_ESIK ? "" : "yesil");
    const barRenk = m.adet <= 0 ? "var(--red)" : (m.adet < STOK_ESIK ? "var(--amber)" : "var(--green)");
    html += '<tr><td><b>'+esc(m.kalite)+'</b> '+esc(m.tip)+' · '+esc(m.genislik)+(m.gramaj!=="-"?' · '+esc(m.gramaj):"")+'<div class="notrow"><span class="adet-edit" onclick="mamulDuzenle('+i+')">✎ ürünü düzenle</span></div></td>'
      + '<td class="num" style="min-width:56px"><span class="adet-edit '+renk+'" onclick="adetDuzenle('+i+')">'+m.adet+'</span>'+doluCubuk(m.adet, STOK_ESIK*3, barRenk)+'</td>'
      + '<td class="num"><span class="adet-edit" onclick="kgBobinDuzenle('+i+')">'+fmtKg(m.kgBobin)+'</span></td>'
      + '<td class="num">'+fmtKg(kg)+'</td>'
      + '<td class="num">'+(deger>0?fmtK(deger):"—")+'</td>'
      + '<td style="text-align:right"><button class="sil-x" onclick="mamulSil('+i+')">×</button></td></tr>';
  });
  html += '<tr><td><b>TOPLAM</b></td><td></td><td></td><td class="num"><b>'+fmtKg(topKg)+'</b></td><td class="num"><b>'+fmtK(mamulDeger)+'</b></td><td></td></tr>';
  html += '</table></div><div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="chip" style="color:var(--green);border-color:var(--green)" onclick="mamulEkle()">+ Yeni Ürün Ekle</button></div>'

let sayimGecici = null;

function sayimKarsilastirModal() {
  sayimGecici = { mamul: {}, hammadde: {} };

}

function sayimModalIcerik() {

  html += '<div class="mini" style="font-weight:800;margin-bottom:6px">Mamul (bobin adedi)</div>';
  data.mamul.forEach((m,i) => {
    const girilenStr = sayimGecici.mamul[i] != null ? sayimGecici.mamul[i] : "";

    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'
      + '<span style="flex:1;font-size:12.5px">'+esc(m.kalite+" "+m.tip+" "+m.genislik)+'<div class="mini">panel: '+m.adet+'</div></span>'
      + '<input type="text" inputmode="decimal" style="width:64px;flex-shrink:0" placeholder="sayım" value="'+esc(girilenStr)+'" oninput="sayimSet(\'mamul\','+i+',this.value)">'
      + '<span style="flex-shrink:0;width:44px;text-align:right;font-weight:800;color:'+(farkVar?(Math.abs(fark)<0.01?"var(--green)":"var(--red)"):"var(--mut)")+'">'+(farkVar?((fark>0?"+":"")+fark):"—")+'</span>'
      + '</div>';
  });
  html += '<div class="mini" style="font-weight:800;margin:12px 0 6px">Hammadde (kg)</div>';
  data.hammadde.forEach((h,i) => {
    const girilenStr = sayimGecici.hammadde[i] != null ? sayimGecici.hammadde[i] : "";
    const girilen = parseTL(girilenStr);
    const farkVar = girilenStr !== "" && !isNaN(girilen);
    const fark = farkVar ? (girilen - (h.kalan||0)) : null;
    html += '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'
      + '<span style="flex:1;font-size:12.5px">'+esc(h.tedarikci+(h.aciklama!=="-"?" ("+h.aciklama+")":""))+'<div class="mini">panel: '+fmtKg(h.kalan)+' kg</div></span>'
      + '<input type="text" inputmode="decimal" style="width:64px;flex-shrink:0" placeholder="sayım" value="'+esc(girilenStr)+'" oninput="sayimSet(\'hammadde\','+i+',this.value)">'
      + '<span style="flex-shrink:0;width:56px;text-align:right;font-weight:800;color:'+(farkVar?(Math.abs(fark)<0.01?"var(--green)":"var(--red)"):"var(--mut)")+'">'+(farkVar?((fark>0?"+":"")+fark.toFixed(1)):"—")+'</span>'
      + '</div>';
  });
  html += '<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="background:var(--green)" onclick="sayimKaydet()">Bu Sayımı Kaydet</button><button class="btn" style="background:#2A2C3A" onclick="sayimModalKapat()">Kapat</button></div>';
  html += '</div>';
  return html;
}

function sayimSet(tur, i, v) {
  sayimGecici[tur][i] = v;
  const el = document.getElementById("sayim-modal");
  if (el) el.innerHTML = sayimModalIcerik();
}

function sayimModalKapat() {
  const el = document.getElementById("sayim-modal");
  if (el) el.remove();
  sayimGecici = null;
}

function sayimKaydet() {
  const farklar = { mamul: [], hammadde: [] };
  data.mamul.forEach((m,i) => {
    const girilenStr = sayimGecici.mamul[i];
    if (girilenStr == null || girilenStr === "") return;
    const girilen = parseTL(girilenStr);
    if (isNaN(girilen)) return;
    farklar.mamul.push({ ad: m.kalite+" "+m.tip+" "+m.genislik, panel: m.adet, sayim: girilen, fark: girilen-m.adet });
  });
  data.hammadde.forEach((h,i) => {
    const girilenStr = sayimGecici.hammadde[i];
    if (girilenStr == null || girilenStr === "") return;
    const girilen = parseTL(girilenStr);
    if (isNaN(girilen)) return;
    farklar.hammadde.push({ ad: h.tedarikci+(h.aciklama!=="-"?" ("+h.aciklama+")":""), panel: h.kalan, sayim: girilen, fark: girilen-(h.kalan||0) });
  });
  if (!farklar.mamul.length && !farklar.hammadde.length) { toast("Hiç sayım değeri girilmedi"); return; }
  if (!data.sayimlar) data.sayimlar = [];
  data.sayimlar.unshift({ tarih: yerelTarihStr(), __id: "sayim_"+Date.now(), mamul: farklar.mamul, hammadde: farklar.hammadde });
  save();
  sayimModalKapat();
  render();
  toast("✓ Sayım kaydedildi");
}

function sayimSil(id) {
  if (!confirm("Bu sayım kaydı silinsin mi?")) return;
  data.sayimlar = data.sayimlar.filter(s => s.__id !== id);
  save(); render();
}

function adetDuzenle(i) {
  const m = data.mamul[i];
  const v = prompt(m.kalite+" "+m.tip+" "+m.genislik+" — yeni adet:", m.adet);
  if (v === null) return;
  const n = parseInt(v);
  if (isNaN(n) || n < 0) { toast("Geçerli adet girin"); return; }
  m.adet = n;
  save(); render();
}

function kgBobinDuzenle(i) {
  const m = data.mamul[i];
  const v = prompt(m.kalite+" "+m.tip+" "+m.genislik+" — bobin başına kg:", String(m.kgBobin).replace(".",","));
  if (v === null) return;
  const n = parseTL(v);
  if (isNaN(n) || n <= 0) { toast("Geçerli kg girin"); return; }
  m.kgBobin = n;
  save(); render();
}

function urunModalKapat() {
  const el = document.getElementById("urun-modal");
  if (el) el.remove();
  // Satış ekranından açılıp iptal edildiyse dropdown'ı sıfırla
  if (window.__yeniUrunKalem != null) { window.__yeniUrunKalem = null; if (tab === "yeni") render(); }
  if (window.__yeniUrunUretimSatiri != null) { window.__yeniUrunUretimSatiri = null; if (tab === "uretim") render(); }
}

function urunKaydet(idx) {
  let kalite = gv("um-kalite");
  if (kalite === "__diger") kalite = (gv("um-kalite-serbest")||"").trim();
  const tip = gv("um-tip").trim() || "Standart";
  const genislik = gv("um-genislik").trim();
  const gramaj = gv("um-gramaj").trim() || "-";
  const adet = parseInt(gv("um-adet"));
  const kgBobin = parseTL(gv("um-kgbobin"));
  if (!kalite) { toast("Kalite gerekli"); return; }
  if (!genislik) { toast("Genişlik gerekli"); return; }
  if (isNaN(kgBobin) || kgBobin <= 0) { toast("Kg/Bobin gerekli"); return; }
  const kayit = {kalite, tip, genislik, gramaj, adet: isNaN(adet)?0:adet, kgBobin};
  if (idx != null && idx >= 0) {
    data.mamul[idx] = kayit;
    toast("✓ Ürün güncellendi");
  } else {
    // aynı ürün var mı kontrol
    const ayni = data.mamul.find(m => m.kalite===kalite && m.tip===tip && m.genislik===genislik && m.gramaj===gramaj);
    if (ayni) { toast("Bu ürün zaten var — adedini düzenleyin"); urunModalKapat(); return; }
    data.mamul.push(kayit);
    toast("✓ Yeni ürün eklendi");
    // Satış ekranından "yeni ürün" ile açıldıysa o satıra otomatik seç + fiyatı öner
    if (window.__yeniUrunKalem != null && form && form.kalemler && form.kalemler[window.__yeniUrunKalem]) {
      form.kalemler[window.__yeniUrunKalem].stokIdx = String(data.mamul.length - 1);
      const f = fiyatBul(kalite);
      if (f > 0 && !form.kalemler[window.__yeniUrunKalem].fiyat) form.kalemler[window.__yeniUrunKalem].fiyat = String(f).replace(".", ",");
    }
    // Üretim ekranından "yeni ürün" ile açıldıysa o satıra otomatik seç
    if (window.__yeniUrunUretimSatiri != null && uForm && uForm.urunler && uForm.urunler[window.__yeniUrunUretimSatiri]) {
      uForm.urunler[window.__yeniUrunUretimSatiri].mamulIdx = String(data.mamul.length - 1);
    }
  }
  window.__yeniUrunKalem = null;
  window.__yeniUrunUretimSatiri = null;
  urunModalKapat();
  save(); render();
}

function hamKaydet(idx) {
  const ted = (gv("hm-ted")||"").trim();
  const aciklama = (gv("hm-acik")||"").trim() || "-";
  const kalite = gv("hm-kalite") || "Genel";
  const alinanRaw = gv("hm-alinan");
  const alinan = alinanRaw.trim() === "" ? null : parseTL(alinanRaw);
  const kalan = parseTL(gv("hm-kalan"));
  const not = (gv("hm-not")||"").trim() || null;
  if (!ted) { toast("Tedarikçi adı gerekli"); return; }
  if (isNaN(kalan) || kalan < 0) { toast("Geçerli kalan kg girin"); return; }
  const kayit = {tedarikci: ted, aciklama, kalite, alinan: (alinan!=null && !isNaN(alinan)) ? alinan : null, kalan, not};
  if (idx != null && idx >= 0) { data.hammadde[idx] = kayit; toast("✓ Hammadde güncellendi"); }
  else { data.hammadde.push(kayit); toast("✓ Yeni hammadde eklendi"); }
  urunModalKapat();
  save(); render();
}

function hamEkle() { hamModal(null); }
function hamDuzenleTam(i) { hamModal(i); }

function hamSil(i) {
  const h = data.hammadde[i];
  if (!confirm(h.tedarikci+" hammadde satırı silinsin mi?")) return;
  data.hammadde.splice(i,1);

}

// ============ MÜŞTERİLER ============

  const girdiler = Object.entries(H.musteriler).sort((a,b) => b[1].toplam - a[1].toplam);
  const genelToplam = girdiler.reduce((s,g) => s + g[1].toplam, 0);
  const genelBekleyen = girdiler.reduce((s,[ad]) => s + musteriBekleyenToplam(ad), 0);
  const genelCari = Object.values(data.cariBakiyeler).reduce((s,v) => s + v, 0);
  let html = '<div class="kpi-grid">'
    + '<div class="kpi"><div class="lbl">Müşteri</div><div class="v">'+girdiler.length+'</div></div>'
    + '<div class="kpi"><div class="lbl">Toplam Satış</div><div class="v yesil">'+pg(fmtK(genelToplam))+'</div></div>'
    + '<div class="kpi"><div class="lbl">Toplam Bekleyen</div><div class="v" style="color:'+(genelBekleyen>0?"var(--red)":"var(--green)")+'">'+pg(fmtK(genelBekleyen))+'</div></div>'
    + (genelCari>0.01 ? '<div class="kpi"><div class="lbl">Toplam Cari Bakiye</div><div class="v yesil">+'+pg(fmtK(genelCari))+'</div><span class="mini">bir sonraki faturalardan otomatik düşer</span></div>' : '')
    + '</div>';
  html += '<div class="card"><div class="mtitle">Müşteri Analizi <span class="pill">satış gelirleri</span></div><div class="scroll"><table><tr><th>Müşteri</th><th class="num">Toplam</th><th class="num">İşlem</th><th>Son Satış</th><th class="num">Bekleyen</th><th></th></tr>';
  girdiler.forEach(([ad, m]) => {
    const bekleyen = musteriBekleyenToplam(ad);
    const kredi = data.cariBakiyeler[normMusteri(ad)] || 0;
    html += '<tr><td><b>'+esc(ad)+'</b></td>'
      + '<td class="num yesil">'+pg(fmt(m.toplam))+'</td>'
      + '<td class="num">'+m.sayi+'</td>'
      + '<td style="white-space:nowrap">'+fmtTarih(m.son)+'</td>'
      + '<td class="num">'
      + (bekleyen>0.01?'<span style="color:var(--red);font-weight:800">'+pg(fmt(bekleyen))+'</span>':'<span style="color:var(--mut)">—</span>')
      + (kredi>0.01?'<div class="mini" style="color:var(--green);font-weight:700">+'+pg(fmt(kredi))+' cari</div>':'')
      + '</td>'
      + '<td style="text-align:right">'+((bekleyen>0.01||kredi>0.01)?'<button class="chip" style="color:var(--green);border-color:var(--green);white-space:nowrap" onclick="musteriTahsilatModal(\''+jsStr(ad)+'\')">💰 Tahsilat</button>':'')+'</td>'
      + '</tr>';
  });
  html += '</table></div></div>';
  return html;
}

// ============ KREDİLER ============
function trFold(s) { return String(s||"").replace(/İ/g,"i").replace(/I/g,"i").toLocaleLowerCase("tr"); }

function krediHesapla(k) {
  const odemeler = data.hareketler.filter(h =>
    h.tur === "GİDER" && h.kategori === "Kredi Ödemesi"
    && trFold(h.aciklama).indexOf(trFold(k.anahtar)) >= 0
    && Math.abs((h.gider||0) - k.taksitTutari) / k.taksitTutari < 0.02
  ).sort((a,b) => a.tarih.localeCompare(b.tarih));
  const odenen = odemeler.length;
  const kalan = Math.max(0, k.taksitSayisi - odenen);
  const kalanTutar = kalan * k.taksitTutari;
  let sonrakiTarih = null;
  if (kalan > 0) {
    const baz = odemeler.length ? odemeler[odemeler.length-1].tarih : k.ilkTarih;
    const d = new Date(baz + "T12:00:00");
    d.setMonth(d.getMonth() + (odemeler.length ? 1 : 0));
    sonrakiTarih = yerelTarihStr(d);
  }
  return {odenen, kalan, kalanTutar, sonrakiTarih, toplamTutar: k.taksitSayisi * k.taksitTutari};
}

function rKrediler() {
  let html = "";
  let toplamKalan = 0;
  data.krediler.forEach(k => {
    const c = krediHesapla(k);
    toplamKalan += c.kalanTutar;
    const yuzde = k.taksitSayisi ? (c.odenen / k.taksitSayisi * 100) : 0;
    html += '<div class="card"><div class="mtitle">'+esc(k.ad)+' <span class="pill">'+c.odenen+'/'+k.taksitSayisi+' taksit</span><span style="flex:1"></span><button class="sil-x" onclick="krediSil(\''+k.id+'\')">×</button></div>'
      + '<div class="bar-track" style="height:10px;margin-bottom:10px"><div class="bar-fill" style="width:'+yuzde+'%"></div></div>'
      + '<div class="hesap-satir"><span>Taksit tutarı</span><b>'+fmt(k.taksitTutari)+'</b></div>'
      + '<div class="hesap-satir"><span>Ödenen</span><b class="yesil">'+fmt(c.odenen * k.taksitTutari)+'</b></div>'
      + '<div class="hesap-satir"><span>Kalan ('+c.kalan+' taksit)</span><b class="kirmizi">'+fmt(c.kalanTutar)+'</b></div>'
      + (c.sonrakiTarih ? '<div class="hesap-satir"><span>Tahmini sonraki ödeme</span><b>'+fmtTarih(c.sonrakiTarih)+'</b></div>' : '<div class="hesap-satir"><span>Durum</span><b class="yesil">✓ Kapandı</b></div>')
      + (c.kalan > 0 ? '<div style="margin-top:12px"><button class="btn" style="background:var(--green)" onclick="krediTaksitOde(\''+k.id+'\')">✓ Taksit Öde ('+fmt(k.taksitTutari)+')</button></div>' : '')
      + '<div class="mini" style="margin-top:8px">"Taksit Öde" bir sonraki taksiti otomatik gider olarak kaydeder. İstersen elle de girebilirsin; açıklamada "'+esc(k.anahtar)+'" geçen ve taksit tutarına yakın (±%2) her ödeme otomatik sayılır.</div>'
      + '</div>';
  });
  html = '<div class="kpi-grid"><div class="kpi"><div class="lbl">Aktif Kredi</div><div class="v">'+data.krediler.length+'</div></div><div class="kpi"><div class="lbl">Toplam Kalan Borç</div><div class="v kirmizi">'+fmtK(toplamKalan)+'</div></div></div>' + html;
  html += '<div class="card"><button class="chip" onclick="krediEkle()">+ Kredi Ekle</button></div>';
  return html;
}

function krediTaksitOde(id) {
  const k = data.krediler.find(x => x.id === id);
  if (!k) return;
  const c = krediHesapla(k);
  if (c.kalan <= 0) { toast("Bu kredi zaten kapandı"); return; }
  const yeniOdenen = c.odenen + 1;
  const bugun = yerelTarihStr();
  if (!confirm(k.ad + "\n\n" + yeniOdenen + ". taksit ödemesi ("+fmt(k.taksitTutari)+") bugün gider olarak kaydedilsin mi?")) return;
  const kayit = {
    tarih: bugun,
    tur: "GİDER",
    aciklama: k.ad,
    kategori: "Kredi Ödemesi",
    gelir: null,
    gider: k.taksitTutari,
    not: "KALAN " + k.taksitSayisi + "/" + (k.taksitSayisi - yeniOdenen) + " TAKSİT",
    __id: "h_" + Date.now() + "_" + Math.random().toString(36).slice(2,7)
  };
  data.hareketler.push(kayit);
  save();
  render();
  toast("✓ " + yeniOdenen + ". taksit ödendi olarak kaydedildi");
}

function krediEkle() {
  const ad = prompt("Kredi adı (ör. Ziraat Makine Kredisi):");
  if (!ad || !ad.trim()) return;
  const taksitS = parseInt(prompt("Toplam taksit sayısı:", "12") || "");
  if (isNaN(taksitS) || taksitS <= 0) { toast("Geçerli taksit sayısı girin"); return; }
  const taksitT = parseTL(prompt("Taksit tutarı (₺):", "") || "");
  if (isNaN(taksitT) || taksitT <= 0) { toast("Geçerli taksit tutarı girin"); return; }
  const anahtar = (prompt("Ödeme kayıtlarında geçen anahtar kelime (ör. ziraat):", "") || "").trim();
  if (!anahtar) { toast("Anahtar kelime gerekli"); return; }
  const ilk = prompt("İlk taksit tarihi (YYYY-AA-GG):", yerelTarihStr()) || yerelTarihStr();
  data.krediler.push({id: "k_" + Date.now(), ad: ad.trim(), taksitSayisi: taksitS, taksitTutari: taksitT, anahtar: trFold(anahtar), ilkTarih: ilk});
  save(); render();
  toast("✓ Kredi eklendi");
}

function krediSil(id) {
  const k = data.krediler.find(x => x.id === id);
  if (!k) return;
  if (!confirm('"'+k.ad+'" kredisi listeden silinsin mi? (Ödeme kayıtları silinmez)')) return;
  data.krediler = data.krediler.filter(x => x.id !== id);
  save(); render();
}

async function yedekleriGetir() {

async function yedekGeriYukle(gunKey) {

// ============ MALİYET HESAPLAYICI ============
function mSet(k,v) { maliyet[k] = v; }

function rMaliyet() {
  const kaliteMasuraKullanir = maliyet.urun === "2. Kalite"; // sadece 2. Kalite'de masura var
  const mas = kaliteMasuraKullanir ? (masuraBul(maliyet.genislik) || {masura:0, bobin:0}) : {masura:0, bobin:0};
  const bobinKg = maliyet.bobinKg !== "" ? parseTL(maliyet.bobinKg) : mas.bobin;
  const masuraKg = kaliteMasuraKullanir ? (maliyet.masuraKg !== "" ? parseTL(maliyet.masuraKg) : mas.masura) : 0;
  const hamF = parseTL(maliyet.hamFiyat);
  const iscilikOrani = (data.ayarlar.iscilik && data.ayarlar.iscilik[maliyet.urun] != null) ? data.ayarlar.iscilik[maliyet.urun] : 0;
  // Satış fiyatı boşsa üründen liste fiyatını al
  let satisF = parseTL(maliyet.satisFiyat);
  if (isNaN(satisF)) satisF = fiyatBul(maliyet.urun);

  let sonucHtml = "";
  if (!isNaN(hamF) && hamF > 0 && !isNaN(bobinKg) && bobinKg > 0 && !isNaN(masuraKg)) {
    const netPlastik = Math.max(0, bobinKg - masuraKg);
    const hamMaliyet = netPlastik * hamF;
    const iscilik = netPlastik * iscilikOrani; // masura kilosuna işçilik verilmez
    const masuraMaliyet = masuraKg * data.ayarlar.masuraFiyat;
    const toplamMaliyet = hamMaliyet + iscilik + masuraMaliyet;
    const birimMaliyet = bobinKg > 0 ? toplamMaliyet / bobinKg : 0;
    const gelirBobin = satisF * bobinKg;
    const kar = gelirBobin - toplamMaliyet;
    const marj = gelirBobin > 0 ? (kar / gelirBobin * 100) : 0;
    sonucHtml = '<div class="card"><div class="mtitle">Sonuç <span class="pill">1 bobin</span></div>'
      + (kaliteMasuraKullanir
        ? '<div class="hesap-satir"><span>Net plastik ('+fmtKg(bobinKg)+' − '+fmtKg(masuraKg)+' masura)</span><b>'+fmtKg(netPlastik)+' kg</b></div>'
        : '<div class="hesap-satir"><span>Net plastik ('+esc(maliyet.urun)+' — masurasız)</span><b>'+fmtKg(netPlastik)+' kg</b></div>')
      + '<div class="hesap-satir"><span>Hammadde ('+fmtKg(netPlastik)+' × '+String(hamF).replace(".",",")+'₺)</span><b>'+fmt(hamMaliyet)+'</b></div>'
      + '<div class="hesap-satir"><span>İşçilik ('+esc(maliyet.urun)+', '+fmtKg(netPlastik)+' × <span class="adet-edit" onclick="event.stopPropagation();ayarDuzenle(\'iscilik_'+maliyet.urun+'\')">'+iscilikOrani+'₺</span>)</span><b>'+fmt(iscilik)+'</b></div>'
      + (kaliteMasuraKullanir ? '<div class="hesap-satir"><span>Masura ('+fmtKg(masuraKg)+' × <span class="adet-edit" onclick="event.stopPropagation();ayarDuzenle(\'masuraFiyat\')">'+data.ayarlar.masuraFiyat+'₺</span>)</span><b>'+fmt(masuraMaliyet)+'</b></div>' : '')
      + '<div class="hesap-satir"><span><b>Toplam maliyet / bobin</b></span><b class="kirmizi">'+fmt(toplamMaliyet)+'</b></div>'
      + '<div class="hesap-satir"><span>Birim maliyet</span><b>'+fmt(birimMaliyet)+'/kg</b></div>'
      + '<div class="hesap-satir"><span>Satış geliri ('+fmtKg(bobinKg)+' × '+String(satisF).replace(".",",")+'₺ KDV hariç)</span><b class="yesil">'+fmt(gelirBobin)+'</b></div>'
      + '<div style="margin-top:14px;text-align:center"><div class="lbl">KÂR / BOBİN (KDV hariç)</div><div class="marj" style="color:'+(kar>=0?"var(--green)":"var(--red)")+'">'+fmt(kar)+'</div><div class="mini">marj %'+marj.toFixed(1)+'</div></div>'
      + '</div>';
  } else {
    sonucHtml = '<div class="card"><div class="mini">Hammadde fiyatını gir — sonuç otomatik hesaplanır. Bobin/masura kg boş bırakılırsa genişlik varsayılanları kullanılır.</div></div>';
  }

  return '<div class="card"><div class="mtitle">Maliyet Hesaplayıcı <span class="pill">bobin başına</span></div><div class="formgrid">'
    + '<div class="row2">'
    + '<div><div class="mini" style="margin-bottom:5px">Ürün</div><select onchange="mSet(\'urun\',this.value);render()">'+["1. Kalite","2. Kalite","ECO-1"].map(u => '<option'+(maliyet.urun===u?" selected":"")+'>'+u+'</option>').join("")+'</select></div>'
    + (kaliteMasuraKullanir
      ? '<div><div class="mini" style="margin-bottom:5px">Genişlik</div><select onchange="mSet(\'genislik\',this.value);render()">'+Object.keys(MASURALAR).map(g => '<option'+(maliyet.genislik===g?" selected":"")+'>'+g+'</option>').join("")+'</select></div>'
      : '<div><div class="mini" style="margin-bottom:5px">&nbsp;</div><div class="mini" style="padding-top:12px">Masurasız (genişlik gerekmiyor)</div></div>')
    + '</div>'
    + '<div class="row2">'
    + '<div><div class="mini" style="margin-bottom:5px">Hammadde ₺/kg (KDV hariç)</div><input type="text" id="m-ham" inputmode="decimal" value="'+esc(maliyet.hamFiyat)+'" oninput="mSet(\'hamFiyat\',this.value);renderKorumali()" placeholder="ör. 43"></div>'
    + '<div><div class="mini" style="margin-bottom:5px">Satış ₺/kg (boş = liste)</div><input type="text" id="m-satis" inputmode="decimal" value="'+esc(maliyet.satisFiyat)+'" oninput="mSet(\'satisFiyat\',this.value);renderKorumali()" placeholder="'+String(fiyatBul(maliyet.urun)).replace(".",",")+'"></div>'
    + '</div>'
    + '<div class="row2">'
    + '<div><div class="mini" style="margin-bottom:5px">Bobin kg'+(kaliteMasuraKullanir?' (boş = varsayılan '+fmtKg(mas.bobin)+')':'')+'</div><input type="text" id="m-bobin" inputmode="decimal" value="'+esc(maliyet.bobinKg)+'" oninput="mSet(\'bobinKg\',this.value);renderKorumali()" placeholder="'+(kaliteMasuraKullanir?"":"ör. 20")+'"></div>'
    + (kaliteMasuraKullanir
      ? '<div><div class="mini" style="margin-bottom:5px">Masura kg (boş = varsayılan '+String(mas.masura).replace(".",",")+')</div><input type="text" id="m-masura" inputmode="decimal" value="'+esc(maliyet.masuraKg)+'" oninput="mSet(\'masuraKg\',this.value);renderKorumali()"></div>'
      : '<div></div>')
    + '</div>'
    + '<div class="mini">İşçilik (dokunarak değiştir, net plastik kg başına): '
    + ["1. Kalite","2. Kalite","ECO-1"].map(u => '<span class="adet-edit" onclick="ayarDuzenle(\'iscilik_'+u+'\')" style="margin-right:8px">'+u+': '+data.ayarlar.iscilik[u]+'₺</span>').join("")
    + '</div>'
    + '<div class="mini" style="margin-top:4px">Masura fiyatı (sadece 2. Kalite): <span class="adet-edit" onclick="ayarDuzenle(\'masuraFiyat\')">'+data.ayarlar.masuraFiyat+'₺/kg</span></div>'
    + '</div></div>' + sonucHtml;
}

// ============ AYLIK ============
function rAylik(H) {
  const keys = Object.keys(H.aylik).sort().reverse();
  let html = '<div class="card"><div class="mtitle">Aylık Genel Bakış</div><div class="scroll"><table><tr><th>Ay</th><th class="num">Satış</th><th class="num">Satış Kg</th><th class="num">Diğer Gelir</th><th class="num">Gider</th><th class="num">Net</th></tr>';
  keys.forEach(k => {
    const a = H.aylik[k];
    const net = a.satis + a.diger - a.gider;
    const p = k.split("-");
    html += '<tr><td style="white-space:nowrap"><b>'+AYLAR[parseInt(p[1])-1]+' '+p[0]+'</b></td>'
      + '<td class="num yesil">'+(a.satis?fmt(a.satis):"")+'</td>'
      + '<td class="num">'+(a.kg?fmtKg(a.kg)+(a.kgBilinen?"":"+"):"")+'</td>'
      + '<td class="num">'+(a.diger?fmtK(a.diger):"")+'</td>'
      + '<td class="num kirmizi">'+(a.gider?fmt(a.gider):"")+'</td>'
      + '<td class="num" style="color:'+(net>=0?"var(--green)":"var(--red)")+';font-weight:800">'+(net>=0?"+":"")+fmtK(net)+'</td></tr>';
  });
  html += '</table></div><div class="mini" style="margin-top:8px">Kg sütunundaki "+" o ay kg bilgisi girilmemiş satışlar da olduğunu gösterir.</div></div>';
  return html;
}

// ============ PIN KİLİDİ + BAŞLATMA ============
const DOGRU_PIN = "4758";
let pinGirilen = "";

function pinNoktalariGuncelle() {
  const noktalar = document.querySelectorAll("#pin-noktalar .pin-nokta");
  noktalar.forEach((n,i) => {
    if (i < pinGirilen.length) n.classList.add("dolu"); else n.classList.remove("dolu");
  });
}

function pinGir(r) {
  if (pinGirilen.length >= 4) return;
  pinGirilen += r;
  pinNoktalariGuncelle();
  if (pinGirilen.length === 4) setTimeout(pinKontrolEt, 120);
}

function pinSil() {
  pinGirilen = pinGirilen.slice(0, -1);
  pinNoktalariGuncelle();
  const m = document.getElementById("kilit-mesaj");
  if (m) { m.textContent = "Şifreyi girin"; m.style.color = ""; }
}

function pinKontrolEt() {
  if (pinGirilen === DOGRU_PIN) {
    try { sessionStorage.setItem("raz-pin-ok", "1"); } catch(e) {}
    document.getElementById("kilit-ekrani").style.display = "none";
    appBaslat();
  } else {
    pinGirilen = "";
    pinNoktalariGuncelle();
    const m = document.getElementById("kilit-mesaj");
    if (m) { m.textContent = "Yanlış şifre — tekrar deneyin"; m.style.color = "#FCA5A5"; }
    if (navigator.vibrate) navigator.vibrate(120);
  }
}

document.addEventListener("keydown", function(e) {
  const kilit = document.getElementById("kilit-ekrani");
  if (!kilit || kilit.style.display === "none") return;
  if (e.key >= "0" && e.key <= "9") pinGir(e.key);
  else if (e.key === "Backspace") pinSil();
});

function tarihGoster() {
  const el = document.getElementById("tarih-goster");
  if (el) {
    const d = new Date();
    el.textContent = d.getDate() + " " + AYLAR[d.getMonth()] + " " + d.getFullYear();
  }
}

let __appBasladi = false;
function appBaslat() {
  if (__appBasladi) return;
  __appBasladi = true;
  window.__bootOK = true;
  // KRİTİK: uygulama içeriğini görünür yap (CSS'te display:none ile gizli başlar)
  const ic = document.getElementById("app-icerik");
  if (ic) ic.style.display = "block";
  const kilit = document.getElementById("kilit-ekrani");
  if (kilit) kilit.style.display = "none";
  tarihGoster();
  tartimYukle();
  try { gizliMod = localStorage.getItem("raz-gizli-mod") === "1"; } catch(e) {}
  // Firebase fonksiyonları henüz gelmediyse geçici güvenli sürümlerini kur —
  // böylece load() içindeki __fbLoad çağrısı asla patlamaz ve ekran anında çizilir.
  if (!window.__fbLoad) {
    window.__onFbReady = function() {
      // Gerçek Firebase yüklendi — buluttan taze veriyi çek
      if (typeof load === "function") load();
    };
    window.__fbLoad = window.__fbLoad || (async () => ({ok:false, error:"Firebase yükleniyor…"}));
    window.__fbSave = window.__fbSave || (async () => false);
    window.__fbListen = window.__fbListen || (() => {});
    window.__fbYedekAl = window.__fbYedekAl || (async () => false);
    window.__fbYedekleriListele = window.__fbYedekleriListele || (async () => []);
    window.__fbYedekGetir = window.__fbYedekGetir || (async () => null);
  }
  // Her durumda hemen çiz (yerel/seed veriyle). Firebase gelince __onFbReady tekrar load() çağırır.
  try { load(); } catch(e) {
    // load() bir şekilde patlarsa bile en azından seed veriyle çiz
    try { if (!data) { data = saglaId(JSON.parse(JSON.stringify(SEED))); resetForm(); } render(); } catch(e2) {}
  }
}

// Oturumda daha önce açıldıysa kilidi atla
(function() {
  let ok = false;
  try { ok = sessionStorage.getItem("raz-pin-ok") === "1"; } catch(e) {}
  if (ok) {
    document.getElementById("kilit-ekrani").style.display = "none";
    appBaslat();
  }
})();
</script>
